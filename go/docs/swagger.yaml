      parameters:
      - description: Group slug
        in: path
        name: groupSlug
        required: true
        type: string
      - description: File IDs
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/jsonapi.BulkIDsRequest'
      produces:
      - application/vnd.api+json
      responses:
        "200":
          description: Per-id outcome
          schema:
            $ref: '#/definitions/jsonapi.BulkResultResponse'
        "403":
          description: Admin role required
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "422":
          description: Bad request body
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Delete files in Trash for good
      tags:
      - trash
  /g/{groupSlug}/trash/files/restore:
    post:
      consumes:
      - application/vnd.api+json
      parameters:
      - description: Group slug
        in: path
        name: groupSlug
        required: true
        type: string
      - description: File IDs
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/jsonapi.BulkIDsRequest'
      produces:
      - application/vnd.api+json
      responses:
        "200":
          description: Per-id outcome
          schema:
            $ref: '#/definitions/jsonapi.BulkResultResponse'
        "422":
          description: Bad request body
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Restore files from Trash
      tags:
      - trash
  /g/{groupSlug}/upcoming:
