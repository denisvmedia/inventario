  /g/{groupSlug}/search:
    get:
      consumes:
      - application/vnd.api+json
      description: |-
        Search one entity type. For commodities, the query string is the item query contract shared with GET /commodities (services/commodityquery).
        Every filter parameter of that endpoint except `type` (taken here by the entity type) is accepted, and an unknown parameter or an unreadable value is a 400.
        Drafts and inactive items are included unless include_inactive=false.
        Locations match on name and address and areas on name: every white-space separated term of q has to be found, ignoring case; results are sorted by name.
        Tags (item and file tags) match when q is found in the label or the slug, ignoring case; results are sorted by label.
      parameters:
      - description: Group slug
        in: path
        name: groupSlug
        required: true
        type: string
      - description: Search text; for commodities, white-space separated terms that
          must all match (see GET /commodities)
        in: query
        name: q
        required: true
        type: string
      - description: Entity type to search
        enum:
        - commodities
        - files
        - areas
        - locations
        - tags
        in: query
        name: type
        type: string
      - default: 20
        description: Maximum number of results
        in: query
        name: limit
        type: integer
      - default: 0
        description: Number of results to skip
        in: query
        name: offset
        type: integer
      - description: Filter by tags (comma-separated); for commodities see tag_mode
        in: query
        name: tags
        type: string
      - description: 'Commodities only: how tags combine, all (default) or any'
        enum:
        - all
        - any
        in: query
        name: tag_mode
        type: string
      - collectionFormat: multi
        description: 'Commodities only: only items with none of these tag slugs (comma-separated
          or repeated)'
        in: query
        items:
          type: string
        name: tags_exclude
        type: array
      - description: 'Commodities only: only items with no tags; cannot be combined
          with tags or tags_exclude'
        in: query
        name: no_tags
        type: boolean
      - collectionFormat: multi
        description: 'Commodities only: filter by status (in_use, sold, lost, disposed,
          written_off); repeat to OR'
        in: query
        items:
          type: string
        name: status
        type: array
      - description: 'Commodities only: filter by exact area ID'
        in: query
        name: area_id
        type: string
      - description: 'Commodities only: only items with no area (ignored when area_id
          is set)'
        in: query
        name: unassigned
        type: boolean
      - collectionFormat: multi
        description: 'Commodities only: filter by seller ID; repeat for several (OR)'
        in: query
        items:
          type: string
        name: seller_id
        type: array
      - description: 'Commodities only: include drafts and non-in_use items (default
          true; false hides them)'
        in: query
        name: include_inactive
        type: boolean
      - collectionFormat: multi
        description: 'Commodities only: filter by computed warranty status (active,
          expiring, expired, none); repeat to OR'
        in: query
        items:
          type: string
        name: warranty_status
        type: array
      - description: 'Commodities only: restrict to items whose warranty expires strictly
          before YYYY-MM-DD'
        in: query
        name: warranty_expires_before
        type: string
      - description: 'Commodities only: true = only items currently lent, false =
          only items not lent'
        in: query
        name: lent_out
        type: boolean
      - description: 'Commodities only: true searches the items in Trash instead of
          the live ones (default false); cannot be combined with lent_out'
        in: query
        name: trashed
        type: boolean
      - description: 'Commodities only: sort field — name|registered_date|purchase_date|current_price|original_price|count,
          prefix with ''-'' for descending'
        in: query
        name: sort
        type: string
      produces:
      - application/vnd.api+json
      responses:
        "200":
          description: Search results
          schema:
            $ref: '#/definitions/jsonapi.SearchResponse'
        "400":
          description: Missing q, unsupported parameter or invalid value
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Advanced search
      tags:
      - search
