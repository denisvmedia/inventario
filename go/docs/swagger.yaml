  models.User:
    properties:
      avatar_path:
        description: |-
          AvatarPath is the blob key of the user's profile photo, or nil when they
          have none and the UI falls back to their initials (#1382).

          The key ends in a revision number (`avatars/<user>/3.jpg`) which exists to
          bust browser caches: replacing a photo writes a new key rather than
          overwriting one, so nothing has to reason about cache headers to make the
          new picture show up.

          Not user input: it is set by the avatar endpoints, which decide the key
          after validating and re-encoding what was uploaded. A client that could
          choose it could point a user's avatar at any object in the bucket.
        type: string
      avatar_url:
        description: |-
          AvatarURL is a transient wire-only field: a signed URL the browser can
          load the profile photo from without the bearer token (#1382). Empty when
          the user has no photo. Handlers that emit a /auth/me-style payload mint
          it for the request's session; it is never stored, so it has no
          migrator annotation and `db:"-"`, like HasPassword.
        type: string
      created_at:
        type: string
      default_group_id:
        description: |-
          DefaultGroupID is the user's preferred landing group after login.
          Nullable: when unset, the login flow falls back to "first group the user
          created, else first group they were invited to" (#1263). ON DELETE SET NULL
          so removing a group silently clears the preference instead of blocking the delete.
        type: string
      email:
        type: string
      has_password:
        description: |-
          HasPassword is a transient wire-only field reflecting whether the
          user has a non-empty password_hash. OAuth-only accounts (#1394)
          have an empty hash until they explicitly set one from the FE; the
          FE branches on this to render "Set a password" instead of "Change
          password". Same posture as IsSystemAdmin — no migrator annotation,
          `db:"-"` so sqlx skips it. Populated by handlers that emit a
          /auth/me-style payload before encoding.
        type: boolean
      id:
        type: string
      is_active:
        type: boolean
      is_system_admin:
        description: |-
          IsSystemAdmin is a transient wire-only field reflecting the user's
          entry in `system_admin_grants` (#1784). It is NEVER persisted on the
          users row — the privilege lives in the grant table. Handlers that
          emit a /auth/me-style payload (the authenticated user reading their
          own identity) populate it from `SystemAdminGrantRegistry.Exists`
          before encoding; the FE uses it as an advisory hint to gate sidebar
          and route visibility. NOTE: since #1785 the /admin/* surface lives
          behind the back-office plane, which this flag has nothing to do with —
          no frontend consumer remains (#2475). The flag stays on the wire
          because the grant it reflects is still real: impersonationTargetGuard
          refuses to borrow the identity of a user who holds one.

          Persistence safety: there is no `//ptah:schema:field` annotation
          so the migration generator never re-adds the column, and the `db:"-"`
          tag tells sqlx to skip the field in both SELECT and INSERT/UPDATE,
          so this stays purely in-memory. A caller that smuggles `true` here
          gains nothing — Go authorization paths never read the field; they
          all consult the grant registry directly.
        type: boolean
      last_login_at:
        type: string
      name:
        type: string
      updated_at:
        type: string
      uuid:
        type: string
    type: object
