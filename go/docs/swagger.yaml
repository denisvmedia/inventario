      - description: Group slug
        in: path
        name: groupSlug
        required: true
        type: string
      - description: File ID
        in: path
        name: fileID
        required: true
        type: string
      responses:
        "204":
          description: No content
        "403":
          description: Admin role required
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "404":
          description: File not in Trash
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "422":
          description: File went to Trash with an item
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Delete a file in Trash for good
      tags:
      - trash
  /g/{groupSlug}/trash/files/{fileID}/restore:
    post:
      description: |-
        Only a file deleted on its own can be restored here; a file
