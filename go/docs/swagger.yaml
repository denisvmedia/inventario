  /users/me/api-tokens:
    get:
      description: |-
        Returns the authenticated user's personal API tokens that are not revoked, newest first, expired ones included. The token values themselves are never returned.
        Requires a browser session; API tokens are refused here (403 api_token.endpoint_not_allowed).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apiserver.APITokensListResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: List personal API tokens
      tags:
      - users-me
    post:
      consumes:
      - application/json
      description: |-
        Creates a token for scripts and other applications and returns it once in `secret`; only its SHA-256 digest is stored.
        Requires a browser session that is not an impersonation session. The caller re-authenticates: `current_password` when the account has a password, and `totp_code` or `backup_code` when two-factor authentication is enabled.
        `scope` is `read_only` (GET, HEAD and OPTIONS only) or `read_write`. `group_id` restricts the token to one group the caller belongs to. `expires_at` is optional.
        Validation failures answer 422 with codes api_token.name_required, api_token.name_too_long, api_token.invalid_scope,
        api_token.expiry_in_past, api_token.group_not_allowed, api_token.limit_reached, api_token.invalid_password or api_token.invalid_mfa_code.
        A password change or reset, disabling two-factor authentication, an account block or a session revoke that lands while the request runs answers 401 api_token.credentials_changed, and no token is created.
      parameters:
      - description: Token settings and re-authentication
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/apiserver.CreateAPITokenRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/apiserver.CreateAPITokenResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Create a personal API token
      tags:
      - users-me
  /users/me/api-tokens/{id}:
    delete:
      description: |-
        Revokes the token at once; the next request made with it answers 401. Returns 404 for an id that is not one of the caller's tokens.
        Requires a browser session that is not an impersonation session.
      parameters:
      - description: Token ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "404":
          description: Not Found
          schema:
            type: string
      summary: Revoke a personal API token
      tags:
      - users-me
  /users/me/login-history:
    get:
      description: Returns the authenticated user's most recent login attempts (default
        100, max 500). Also returns failed_last_7d for the optional banner.
      parameters:
      - description: Cap on number of events returned (default 100, max 500)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apiserver.LoginHistoryResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
      summary: List login history
      tags:
      - users-me
  /users/me/sessions:
    delete:
      description: |-
        Revoke every refresh token for the authenticated user except the one identified as current.
        Resolution order for the "current" session: `?keep_id=<id>` (recommended; the id the FE
        rendered with `is_current: true` on GET /users/me/sessions) → access token `rti` claim
        → refresh cookie hash. When none matches, the request is rejected with 400 (the current
        session can't be identified, so revoking everything is refused).
      parameters:
      - description: Session id to keep alive (the is_current row from GET /users/me/sessions).
          Optional — when omitted the BE falls back to the access token's rti claim,
          then the refresh cookie.
        in: query
        name: keep_id
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
      summary: Revoke all other sessions
      tags:
      - users-me
    get:
      description: Returns the authenticated user's active refresh-token sessions,
        with a flag identifying the session bound to the current refresh cookie.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apiserver.SessionsListResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
      summary: List active sessions
      tags:
      - users-me
  /users/me/sessions/{id}:
    delete:
      description: Mark a single refresh token as revoked. Returns 404 if the id does
        not belong to the authenticated user.
      parameters:
      - description: Session ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Not Found
          schema:
            type: string
      summary: Revoke one session
      tags:
      - users-me
  /verify-email:
    get:
      description: Activate a user account using the verification token sent by email.
      parameters:
      - description: Email verification token
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request - missing, invalid, or expired token
          schema:
