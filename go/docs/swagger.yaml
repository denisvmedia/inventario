      - description: Group slug
        in: path
        name: groupSlug
        required: true
        type: string
      - description: Setting field path (e.g., uiconfig.theme)
        in: path
        name: field
        required: true
        type: string
      - description: Setting value envelope with required value.
        in: body
        name: value
