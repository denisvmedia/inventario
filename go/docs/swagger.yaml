      tags:
      - commodity_services
  /g/{groupSlug}/settings:
    get:
      consumes:
      - application/json
      description: get current settings
      parameters:
      - description: Group slug
        in: path
        name: groupSlug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SettingsObject'
      summary: Get current settings
      tags:
      - settings
    put:
      consumes:
      - application/json
      description: update entire settings object
      parameters:
      - description: Group slug
        in: path
        name: groupSlug
        required: true
