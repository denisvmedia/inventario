basePath: /api/v1
definitions:
  apiserver.APITokenView:
    properties:
      created_at:
        type: string
      expired:
        description: |-
          Expired is true once ExpiresAt has passed. An expired token is listed
          so its owner can see why a script stopped working, and can be revoked
          to remove it from the list.
        type: boolean
      expires_at:
        description: ExpiresAt is absent for a token that does not expire.
        type: string
      group_id:
        description: |-
          GroupID is the one group the token may reach, or absent for every group
          the owner belongs to.
        type: string
      id:
        type: string
      last_used_at:
        description: LastUsedAt is accurate to five minutes; absent when never used.
        type: string
      name:
        description: Name is the label the user gave the token.
        type: string
      scope:
        allOf:
        - $ref: '#/definitions/models.APITokenScope'
        enum:
        - read_only
        - read_write
      token_prefix:
        description: |-
          TokenPrefix is the start of the token, e.g. "inv_pat_AbCd", to tell
          tokens apart.
        type: string
    type: object
  apiserver.APITokensListResponse:
    properties:
      tokens:
        items:
          $ref: '#/definitions/apiserver.APITokenView'
        type: array
    type: object
  apiserver.AdminAddMemberRequest:
    properties:
      role:
        allOf:
        - $ref: '#/definitions/models.GroupRole'
        description: 'Role is the group role granted to the user: viewer|user|admin|owner.'
      userID:
        description: UserID is the ID of the user being added to the group.
        type: string
    required:
    - role
    - userID
    type: object
  apiserver.AdminBlockRequest:
    properties:
      force:
        description: |-
          Force overrides the "cannot block another system admin" guard.
          Has no effect when blocking a non-admin user.
        type: boolean
      reason:
        description: Reason is the free-form justification for the block (max 500
          chars).
        maxLength: 500
        type: string
    required:
    - reason
    type: object
  apiserver.AdminMemberEnvelope:
    properties:
      data:
        $ref: '#/definitions/apiserver.AdminMemberResource'
    type: object
  apiserver.AdminMemberResource:
    properties:
      attributes:
        $ref: '#/definitions/apiserver.AdminMemberView'
      id:
        type: string
      type:
        type: string
    type: object
  apiserver.AdminMemberView:
    properties:
      group_id:
        type: string
      joined_at:
        type: string
      member_user_id:
        type: string
      role:
        $ref: '#/definitions/models.GroupRole'
      tenant_id:
        type: string
    type: object
  apiserver.AdminPingResponse:
    properties:
      ok:
        type: boolean
      timestamp:
        type: string
    type: object
  apiserver.AdminRevokeSessionsRequest:
    properties:
      reason:
        description: |-
          Reason is the free-form justification for ending the sessions
          (max 500 chars).
        maxLength: 500
        type: string
    required:
    - reason
    type: object
  apiserver.AdminUnblockRequest:
    properties:
      reason:
        description: Reason is the free-form justification for the unblock (max 500
          chars).
        maxLength: 500
        type: string
    required:
    - reason
    type: object
  apiserver.AdminUpdateMemberRoleRequest:
    properties:
      role:
        allOf:
        - $ref: '#/definitions/models.GroupRole'
        description: 'Role is the new group role: viewer|user|admin|owner.'
    required:
    - role
    type: object
  apiserver.AdminUserEnvelope:
    properties:
      data:
        $ref: '#/definitions/apiserver.AdminUserResource'
    type: object
  apiserver.AdminUserResource:
    properties:
      attributes:
        $ref: '#/definitions/apiserver.AdminUserView'
      id:
        type: string
      type:
        type: string
    type: object
  apiserver.AdminUserView:
    properties:
      email:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      is_system_admin:
        type: boolean
      name:
        type: string
      tenant_id:
        type: string
    type: object
  apiserver.AvatarUploadResponse:
    properties:
      avatar_path:
        description: AvatarPath is the stored key.
        type: string
      avatar_url:
        description: |-
          AvatarURL is a signed URL the browser can load the new photo from.
          Empty when the server has no signer configured.
        type: string
    type: object
  apiserver.BackofficeLoginMFARequest:
    properties:
      backup_code:
        type: string
      mfa_token:
        type: string
      totp_code:
        type: string
    type: object
  apiserver.BackofficeLoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  apiserver.BackofficeLoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      token_type:
        type: string
      user:
        $ref: '#/definitions/apiserver.BackofficeProfile'
    type: object
  apiserver.BackofficeLogoutResponse:
    properties:
      message:
        type: string
    type: object
  apiserver.BackofficeMFARequiredResponse:
    properties:
      code:
        description: |-
          Code mirrors a stable identifier so FE clients can branch on it
          instead of an HTTP status alone. Today only the 501 branch sets
          `backofficeMFANotImplementedCode`; future codes can be added
          without breaking older FE clients.
        type: string
      email:
        type: string
      expires_in:
        description: |-
          ExpiresIn carries the MFAToken lifetime in seconds so the FE can
          disable the code-entry surface when the token lapses. Zero on the
          501 branch.
        type: integer
      mfa_required:
        type: boolean
      mfa_token:
        description: |-
          MFAToken is the short-lived (5 min) step-1 token that the FE must
          echo back to /login/mfa alongside the TOTP / backup code. Empty
          on the 501 (not-implemented) branch.
        type: string
    type: object
  apiserver.BackofficeProfile:
    properties:
      email:
        type: string
      id:
        type: string
      last_login_at:
        type: string
      mfa_enforced:
        type: boolean
      name:
        type: string
      role:
        type: string
    type: object
  apiserver.BackupPublicKeyResponse:
    properties:
      algorithm:
        description: Algorithm names the hash-then-sign construction ("ed25519-sha256").
        type: string
      fingerprint:
        description: |-
          Fingerprint is the lowercase hex SHA-256 of the raw public key, a stable
          short identifier for the signing key (useful around key rotation).
        type: string
      public_key:
        description: |-
          PublicKey is the PKIX-encoded PEM public key ("PUBLIC KEY" block) — the
          form openssl and Go's x509.ParsePKIXPublicKey expect.
        type: string
    type: object
  apiserver.ChangePasswordRequest:
    properties:
      current_password:
        type: string
      new_password:
        type: string
    type: object
  apiserver.CreateAPITokenRequest:
    properties:
      backup_code:
        type: string
      current_password:
        description: CurrentPassword is required when the account has a password.
        type: string
      expires_at:
        description: ExpiresAt is an RFC 3339 time in the future, or absent for no
          expiry.
        type: string
      group_id:
        description: GroupID restricts the token to one group the caller is a member
          of.
        type: string
      name:
        type: string
      scope:
        enum:
        - read_only
        - read_write
        type: string
      totp_code:
        description: |-
          TOTPCode or BackupCode is required when the account has two-factor
          authentication enabled.
        type: string
    type: object
  apiserver.CreateAPITokenResponse:
    properties:
      secret:
        type: string
      token:
        $ref: '#/definitions/apiserver.APITokenView'
    type: object
  apiserver.DeleteAccountRequest:
    properties:
      password:
        type: string
    type: object
  apiserver.FeatureFlags:
    properties:
      currency_migration:
        description: |-
          CurrencyMigration mirrors Params.FeatureCurrencyMigration. When
          false the /currency-migrations endpoints return a coded 404 and
          the FE hides the wizard entry point + history sheet on the
          group-settings page.
        type: boolean
      magic_link_login:
        description: |-
          MagicLinkLogin mirrors Params.MagicLinkLoginEnabled. The entry point
          is pre-login (a "Email me a sign-in link" affordance on the Login
          page), so it is exposed here on the public /feature-flags surface
          rather than the auth-gated /system endpoint. When false the FE hides
          the affordance and the /auth/magic-link routes return 404.
        type: boolean
      public_scan:
        description: |-
          PublicScan mirrors Params.PublicScanEnabled. The entry point is the
          anonymous landing-page "add your first item" CTA (#1988), so — like
          MagicLinkLogin — it is read pre-login on this public surface. When
          false the FE hides the CTA and the POST /public/commodities/scan
          route is not mounted (404).
        type: boolean
    type: object
  apiserver.FeedbackRequest:
    properties:
      diagnostics:
        additionalProperties:
          type: string
        description: |-
          Diagnostics is the FE-controlled set of debug attributes. Keys
          are surfaced verbatim — the BE does not whitelist or rewrite
          them — but the BE caps per-line size and the number of entries.
        type: object
      message:
        description: |-
          Message is the free-form body. Required, trimmed, capped at
          feedbackMaxMessageBytes.
        type: string
      reply_to_email:
        description: |-
          ReplyToEmail is optional. When set the value goes into the email
          body and (in the async sender) into the Reply-To header. Empty
          means "the submitter declined to share a reply-to address".
        type: string
      type:
        description: |-
          Type is one of "feedback" | "bug" | "feature" | "question". The
          FE renders these as radio chips; the backend uses the value
          verbatim in the email subject and body. Unknown values are
          rejected with 400.
        enum:
        - feedback
        - bug
        - feature
        - question
        type: string
    required:
    - message
    - type
    type: object
  apiserver.FeedbackResponse:
    properties:
      status:
        type: string
    type: object
  apiserver.ForgotPasswordRequest:
    properties:
      email:
        type: string
    type: object
  apiserver.GroupNotificationsPatchRequest:
    properties:
      warranty_expiring_alerts:
        type: boolean
      weekly_digest:
        type: boolean
    type: object
  apiserver.GroupNotificationsResponse:
    properties:
      warranty_expiring_alerts:
        type: boolean
      weekly_digest:
        type: boolean
    type: object
  apiserver.ImpersonateRequest:
    properties:
      reason:
        description: |-
          Reason is the optional free-form justification for the
          impersonation (max 500 chars). The maxLength struct tag surfaces
          the cap into the generated OpenAPI schema; the handler enforces
          the same bound at decode time (impersonationReasonMaxLen).
        maxLength: 500
        type: string
    type: object
  apiserver.ImpersonationOperatorView:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      role:
        type: string
    type: object
  apiserver.ImpersonationStateResponse:
    properties:
      active:
        description: Active reports whether the caller is inside an impersonation
          session.
        type: boolean
      expires_at:
        type: string
      operator:
        allOf:
        - $ref: '#/definitions/apiserver.ImpersonationOperatorView'
        description: |-
          Operator is the back-office operator who initiated the session —
          nil when Active is false. Renamed from `admin_user` at #1785
          Phase 5 to reflect that the operator-of-record now lives in the
          back-office identity plane.
      started_at:
        description: StartedAt / ExpiresAt bound the session — zero values when inactive.
        type: string
      target_user:
        allOf:
        - $ref: '#/definitions/apiserver.ImpersonationUserView'
        description: TargetUser is the impersonated tenant user — nil when Active
          is false.
    type: object
  apiserver.ImpersonationUserView:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      tenant_id:
        type: string
    type: object
  apiserver.LoginEventView:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      ip_address:
        type: string
      method:
        $ref: '#/definitions/models.LoginMethod'
      outcome:
        $ref: '#/definitions/models.LoginOutcome'
      user_agent:
        type: string
    type: object
  apiserver.LoginHistoryResponse:
    properties:
      events:
        items:
          $ref: '#/definitions/apiserver.LoginEventView'
        type: array
      failed_last_7d:
        type: integer
    type: object
  apiserver.LoginMFARequest:
    properties:
      backup_code:
        type: string
      mfa_token:
        type: string
      totp_code:
        type: string
    type: object
  apiserver.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  apiserver.LoginResponse:
    properties:
      access_token:
        type: string
      csrf_token:
        description: CSRF token for protecting state-changing requests
        type: string
      expires_in:
        description: seconds until access token expiry
        type: integer
      token_type:
        type: string
      user:
        $ref: '#/definitions/models.User'
    type: object
  apiserver.LogoutResponse:
    properties:
      message:
        type: string
    type: object
  apiserver.MFADisableRequest:
    properties:
      backup_code:
        type: string
      password:
        type: string
      totp_code:
        type: string
    type: object
  apiserver.MFASetupResponse:
    properties:
      qr_code_url:
        type: string
      secret:
        type: string
    type: object
  apiserver.MFAState:
    enum:
    - none
    - pending
    - active
    type: string
    x-enum-varnames:
    - MFAStateNone
    - MFAStatePending
    - MFAStateActive
  apiserver.MFAStatusResponse:
    properties:
      backup_codes_remaining:
        type: integer
      enabled_at:
        type: string
      last_used_at:
        type: string
      state:
        $ref: '#/definitions/apiserver.MFAState'
    type: object
  apiserver.MFAVerifyRequest:
    properties:
      code:
        type: string
    type: object
  apiserver.MFAVerifyResponse:
    properties:
      backup_codes:
        items:
          type: string
        type: array
    type: object
  apiserver.MagicLinkRequest:
    properties:
      email:
        type: string
    type: object
  apiserver.MagicLinkVerifyRequest:
    properties:
      token:
        type: string
    type: object
  apiserver.PatchSettingRequest:
    properties:
      value:
        description: Value is the setting value to apply and is required when using
          the object envelope.
    type: object
  apiserver.RegisterRequest:
    properties:
      email:
        type: string
      invite_token:
        description: |-
          InviteToken, when present and valid, allows registration even if
          RegistrationMode is closed and suppresses the email-verification step
          (the invite itself vouches for the user). The token is NOT consumed
          here — the caller must POST /api/v1/invites/{token}/accept after
          logging in. See issue #1219 §7 and #1285.

          When the invite carries `invitee_email` (the #1533 email-flow path),
          the registration `email` must match it after trim + case-insensitive
          normalization, otherwise the request is rejected with 400. A
          whitespace-only invitee_email (only reachable via direct registry
          write — the JSON-API binder strips whitespace) is treated as
          invalid and rejected. Legacy token-only invites (invitee_email ==
          nil) keep working unchanged. See #1221.
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  apiserver.ResendVerificationRequest:
    properties:
      email:
        type: string
    type: object
  apiserver.ResetPasswordRequest:
    properties:
      new_password:
        type: string
      token:
        type: string
    type: object
  apiserver.SeedRequest:
    properties:
      tenant_slug:
        type: string
      user_email:
        type: string
    type: object
  apiserver.SeedResponse:
    properties:
      already_seeded:
        type: boolean
      message:
        type: string
      status:
        type: string
    type: object
  apiserver.SessionView:
    properties:
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: string
      ip_address:
        type: string
      is_current:
        type: boolean
      last_used_at:
        type: string
      user_agent:
        type: string
    type: object
  apiserver.SessionsListResponse:
    properties:
      sessions:
        items:
          $ref: '#/definitions/apiserver.SessionView'
        type: array
    type: object
  apiserver.SettingsUpdateRequest:
    properties:
      default_date_format:
        description: DefaultDateFormat is the uiconfig.default_date_format value accepted
          by PUT /settings.
        type: string
      show_debug_info:
        description: ShowDebugInfo is the uiconfig.show_debug_info value accepted
          by PUT /settings.
        type: boolean
      theme:
        description: Theme is the uiconfig.theme value accepted by PUT /settings.
        type: string
    type: object
  apiserver.SystemInfo:
    properties:
      build_date:
        type: string
      commit:
        type: string
      database_backend:
        description: System information
        type: string
      debug:
        description: |-
          Debug reflects INVENTARIO_DEBUG_UI. When true the frontend shows
          crash details (error message + stack) on its error screen. Off by
          default so production never exposes a stack trace to end users.
        type: boolean
      file_storage_backend:
        type: string
      go_version:
        type: string
      loan_reminder_due_soon_days:
        description: |-
          LoanReminderDueSoonDays is the server-wide default for how many days
          before the due date the loan reminder goes out
          (--loan-reminder-due-soon-days). A user's
          notifications.loan_lead_time setting replaces it for them.
        type: integer
      memory_usage:
        type: string
      num_cpu:
        type: integer
      num_goroutines:
        type: integer
      operating_system:
        type: string
      platform:
        type: string
      settings:
        allOf:
        - $ref: '#/definitions/models.SettingsObject'
        description: Settings information
      uptime:
        description: Runtime metrics
        type: string
      version:
        description: Version information
        type: string
    type: object
  apiserver.WorkerControlEnvelope:
    properties:
      data:
        $ref: '#/definitions/apiserver.WorkerControlResource'
    type: object
  apiserver.WorkerControlListEnvelope:
    properties:
      data:
        items:
          $ref: '#/definitions/apiserver.WorkerControlResource'
        type: array
    type: object
  apiserver.WorkerControlResource:
    properties:
      attributes:
        $ref: '#/definitions/apiserver.WorkerControlView'
      id:
        type: string
      type:
        type: string
    type: object
  apiserver.WorkerControlView:
    properties:
      paused:
        type: boolean
      paused_at:
        type: string
      paused_by:
        type: string
      reason:
        type: string
      updated_at:
        type: string
      worker_type:
        type: string
    type: object
  apiserver.WorkerPauseRequest:
    properties:
      reason:
        description: |-
          Reason is the optional operator-supplied note for the pause (max 500
          chars). Persisted into worker_control.reason and the audit breadcrumb.
        maxLength: 500
        type: string
    type: object
  apiserver.linkedIdentitiesResponse:
    properties:
      identities:
        items:
          $ref: '#/definitions/apiserver.linkedIdentityEntry'
        type: array
    type: object
  apiserver.linkedIdentityEntry:
    properties:
      email:
        type: string
      linked_at:
        type: string
      provider:
        type: string
    type: object
  apiserver.providerListEntry:
    properties:
      display_name:
        type: string
      name:
        type: string
    type: object
  apiserver.providerListResponse:
    properties:
      providers:
        items:
          $ref: '#/definitions/apiserver.providerListEntry'
        type: array
    type: object
  debug.Info:
    properties:
      database_driver:
        type: string
      error: {}
      file_storage_driver:
        type: string
      operating_system:
        type: string
    type: object
  jsonapi.AdminGroupDetail:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      currency:
        type: string
      id:
        type: string
      member_count:
        type: integer
      name:
        type: string
      slug:
        type: string
      status:
        $ref: '#/definitions/models.LocationGroupStatus'
      tenant:
        $ref: '#/definitions/jsonapi.AdminGroupTenantChip'
      tenant_id:
        type: string
      type:
        enum:
        - admin_groups
        example: admin_groups
        type: string
      updated_at:
        type: string
    type: object
  jsonapi.AdminGroupListItem:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      currency:
        type: string
      id:
        type: string
      member_count:
        type: integer
      name:
        type: string
      slug:
        type: string
      status:
        $ref: '#/definitions/models.LocationGroupStatus'
      tenant:
        $ref: '#/definitions/jsonapi.AdminGroupTenantChip'
      tenant_id:
        type: string
      type:
        enum:
        - admin_groups
        example: admin_groups
        type: string
      updated_at:
        type: string
    type: object
  jsonapi.AdminGroupMember:
    properties:
      group_id:
        type: string
      id:
        type: string
      joined_at:
        type: string
      member_user_id:
        type: string
      role:
        $ref: '#/definitions/models.GroupRole'
      type:
        enum:
        - admin_group_members
        example: admin_group_members
        type: string
      user:
        $ref: '#/definitions/jsonapi.AdminGroupMemberUser'
    type: object
  jsonapi.AdminGroupMemberUser:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  jsonapi.AdminGroupMembersResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/jsonapi.AdminGroupMember'
        type: array
    type: object
  jsonapi.AdminGroupResponse:
    properties:
      data:
        $ref: '#/definitions/jsonapi.AdminGroupDetail'
    type: object
  jsonapi.AdminGroupTenantChip:
    properties:
      id:
        type: string
      name:
        type: string
      slug:
        type: string
    type: object
  jsonapi.AdminGroupsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/jsonapi.AdminGroupListItem'
        type: array
      meta:
        $ref: '#/definitions/jsonapi.AdminListMeta'
    type: object
  jsonapi.AdminListMeta:
    properties:
      page:
        example: 1
        type: integer
      per_page:
        example: 50
        type: integer
      total:
        example: 100
        type: integer
      total_pages:
        example: 2
        type: integer
    type: object
  jsonapi.AdminTenantListItem:
    properties:
      created_at:
        type: string
      domain:
        type: string
      group_count:
        type: integer
      id:
        type: string
      is_default:
        type: boolean
      name:
        type: string
      plan_id:
        type: string
      registration_mode:
        type: string
      slug:
        type: string
      status:
        $ref: '#/definitions/models.TenantStatus'
      type:
        enum:
        - admin_tenants
        example: admin_tenants
        type: string
      updated_at:
        type: string
      user_count:
        type: integer
    type: object
  jsonapi.AdminTenantResponse:
    properties:
      data:
        $ref: '#/definitions/jsonapi.AdminTenantListItem'
    type: object
  jsonapi.AdminTenantsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/jsonapi.AdminTenantListItem'
        type: array
      meta:
        $ref: '#/definitions/jsonapi.AdminListMeta'
    type: object
  jsonapi.AdminUserDetail:
    properties:
      active_session_count:
        type: integer
      created_at:
        type: string
      email:
        type: string
      group_memberships:
        items:
          $ref: '#/definitions/jsonapi.AdminUserGroupMembership'
        type: array
