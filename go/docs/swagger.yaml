info:
  contact:
    email: ask@artprima.cz
    name: Inventario Support
    url: https://github.com/denisvmedia/inventario/issues
  description: This is an Inventario daemon.
  license:
    name: MIT
  title: Inventario API
  version: "1.0"
paths:
  /admin/_ping:
    get:
      description: Returns 200 when the caller is authenticated on the back-office
        plane. Probe endpoint for the admin surface (#1745).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apiserver.AdminPingResponse'
        "401":
          description: Unauthorized - back-office authentication required
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "403":
          description: Account disabled
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Back-office ping
      tags:
      - admin
  /admin/debug:
    get:
      consumes:
      - application/json
      description: get debug information about file storage, database driver, and
        operating system (back-office only)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/debug.Info'
        "401":
          description: Unauthorized - back-office authentication required
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Get debug information
      tags:
      - admin
  /admin/groups:
    get:
      description: Returns every location group with computed member_count and an
        owning-tenant chip (id, name, slug). Paginate via ?page&per_page; ?q ILIKE-matches
        name/slug; ?tenantID/?status filter exactly; ?sort/?order set ordering.
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 50, max 100)
        in: query
        name: per_page
        type: integer
      - description: Search term — ILIKE match on name/slug
        in: query
        name: q
        type: string
      - description: Filter to groups belonging to this tenant ID (exact match)
        in: query
        name: tenantID
        type: string
      - description: Filter to groups in this status (exact match)
        enum:
        - active
        - pending_deletion
        in: query
        name: status
        type: string
      - description: 'Sort field: name|slug|created_at|status (prefix with - for desc)'
        in: query
        name: sort
        type: string
      - description: Sort direction override (wins over `-` prefix)
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      produces:
      - application/vnd.api+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/jsonapi.AdminGroupsResponse'
        "401":
          description: Unauthorized - back-office authentication required
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "403":
          description: Account disabled
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: List groups (admin)
      tags:
      - admin
  /admin/groups/{groupID}:
    delete:
      description: Sets the group's status to `pending_deletion`; the group purge
        worker finishes the hard-delete asynchronously. Idempotent — re-deleting an
        already-pending group returns 200. Returns the post-transition group row.
      parameters:
      - description: Group ID
        in: path
        name: groupID
        required: true
        type: string
      produces:
      - application/vnd.api+json
      responses:
        "200":
          description: OK - group marked pending_deletion (or already was)
          schema:
            $ref: '#/definitions/jsonapi.AdminGroupResponse'
        "401":
          description: Unauthorized - back-office authentication required
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "403":
          description: Account disabled
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "404":
          description: Group not found
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Soft-delete a group (admin)
      tags:
      - admin
    get:
      description: Returns the group row with computed member_count and an owning-tenant
        chip (tenant id, name, slug). Crosses tenants by design.
      parameters:
      - description: Group ID
        in: path
        name: groupID
        required: true
        type: string
      produces:
      - application/vnd.api+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/jsonapi.AdminGroupResponse'
        "401":
          description: Unauthorized - back-office authentication required
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "403":
          description: Account disabled
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "404":
          description: Group not found
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Get group (admin)
      tags:
      - admin
  /admin/groups/{groupID}/members:
    get:
      description: Returns the group's memberships joined with each member user's
        id / name / email, cross-tenant. An unknown group ID is a 404; an existing
        group with no members is a 200 with an empty `data` array.
      parameters:
      - description: Group ID
        in: path
        name: groupID
        required: true
        type: string
      produces:
      - application/vnd.api+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/jsonapi.AdminGroupMembersResponse'
        "401":
          description: Unauthorized - back-office authentication required
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "403":
          description: Account disabled
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "404":
          description: Not Found - unknown group
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: List a group's members (admin)
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: |-
        Adds a user to a group with the given role, bypassing the per-group admin check. The membership cap is still enforced — a user already at the cap is rejected with 422.
        Returns 422 with `admin.member.tenant_mismatch` when the target user's tenant differs from the group's tenant, `admin.member.invalid_role` for a missing or invalid role, and `admin.member.user_required` for a missing userID.
      parameters:
      - description: Group ID
        in: path
        name: groupID
        required: true
        type: string
      - description: Add-member request
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/apiserver.AdminAddMemberRequest'
      produces:
      - application/vnd.api+json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/apiserver.AdminMemberEnvelope'
        "400":
          description: Bad Request - invalid body
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "401":
          description: Unauthorized - back-office authentication required
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "403":
          description: Account disabled
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "404":
          description: Not Found - unknown group or user
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "422":
          description: Unprocessable Entity - tenant mismatch, cap reached, duplicate,
            or invalid role
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Add a member to a group (admin)
      tags:
      - admin
  /admin/groups/{groupID}/members/{userID}:
    delete:
      description: Removes a user from a group, bypassing the per-group admin check.
        The ≥1-owner and ≥1-member invariants still apply — removing the last owner
        returns 422, removing the last member returns 422 with `group.last_member`.
      parameters:
      - description: Group ID
        in: path
        name: groupID
        required: true
        type: string
      - description: User ID of the member to remove
        in: path
        name: userID
        required: true
        type: string
      produces:
      - application/vnd.api+json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized - back-office authentication required
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "403":
          description: Account disabled
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "404":
          description: Not Found - user is not a member of the group
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "422":
          description: Unprocessable Entity - removing the last owner or last member
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Remove a member from a group (admin)
      tags:
      - admin
    patch:
      consumes:
      - application/json
      description: Changes a group member's role, bypassing the per-group admin check.
        Demoting the sole owner is rejected with 422 (`ErrLastOwner`). Returns 422
        with `admin.member.invalid_role` for a missing or invalid role.
      parameters:
      - description: Group ID
        in: path
        name: groupID
        required: true
        type: string
      - description: User ID of the member
        in: path
        name: userID
        required: true
        type: string
      - description: Role-change request
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/apiserver.AdminUpdateMemberRoleRequest'
      produces:
      - application/vnd.api+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apiserver.AdminMemberEnvelope'
        "400":
          description: Bad Request - invalid body
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "401":
          description: Unauthorized - back-office authentication required
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "403":
          description: Account disabled
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "404":
          description: Not Found - user is not a member of the group
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "422":
          description: Unprocessable Entity - demoting the last owner or invalid role
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Change a member's role (admin)
      tags:
      - admin
  /admin/impersonation/current:
    get:
      description: |-
        Convenience read for the FE impersonation banner. Returns `active=false` with no other fields when the
        caller is not inside an impersonation session, and the target/operator/started_at/expires_at quartet when
        it is. Reachable from EITHER the operator's back-office session OR the impersonated tenant session.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apiserver.ImpersonationStateResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Read the active impersonation session
      tags:
      - admin
  /admin/impersonation/end:
    post:
      description: |-
        Ends the active impersonation session: blacklists the impersonation access token, mints a fresh back-office
        access token, and re-plants the operator's `backoffice_refresh_token` cookie (when one was captured at
        start). Must be called with the impersonation access token (the token carrying `imp=true`). The token's
        signature is always verified; an expired impersonation token is still accepted so an operator can end an
        idle session without re-logging in.
        This endpoint is mounted WITHOUT the JWT middleware and self-validates the impersonation token off the
        Authorization header. Returns 401 when the token is missing, malformed, forged, or not an impersonation
        token (an authentication failure). Returns 422 with `admin.impersonate.not_active` when the token is a
        validly-signed impersonation token but no active session backs it — the return slot is missing or its
        operator-of-record disagrees with the token. A 500 is returned only on a genuine store or registry fault.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apiserver.BackofficeLoginResponse'
        "401":
          description: Unauthorized - missing, malformed, forged, or non-impersonation
            token
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "422":
          description: Unprocessable Entity - no active impersonation session (missing/mismatched
            return slot)
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "500":
          description: Internal Server Error - return-slot store or registry fault
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: End an impersonation session (back-office operator)
      tags:
      - admin
  /admin/tenants:
    get:
      description: Returns every tenant with computed user_count and group_count.
        Pagination via ?page&per_page; ?q matches name/slug/domain (ILIKE); ?sort=<field>
        with optional `-` prefix for desc, or explicit ?order=asc|desc.
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 50, max 100)
        in: query
        name: per_page
        type: integer
      - description: Search term — ILIKE match on name/slug/domain
        in: query
        name: q
        type: string
      - description: 'Sort field: name|slug|created_at|status (prefix with - for desc)'
        in: query
        name: sort
        type: string
      - description: 'Sort direction override: asc|desc (wins over `-` prefix)'
        in: query
        name: order
        type: string
      produces:
      - application/vnd.api+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/jsonapi.AdminTenantsResponse'
        "401":
          description: Unauthorized - back-office authentication required
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "403":
          description: Account disabled
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: List tenants (admin)
      tags:
      - admin
  /admin/tenants/{tenantID}:
    get:
      description: Returns the tenant row with computed user_count and group_count.
        No nested users or groups list — those live behind GET /admin/tenants/{tenantID}/users
        (#1746).
      parameters:
      - description: Tenant ID
        in: path
        name: tenantID
        required: true
        type: string
      produces:
      - application/vnd.api+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/jsonapi.AdminTenantResponse'
        "401":
          description: Unauthorized - back-office authentication required
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "403":
          description: Account disabled
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "404":
          description: Tenant not found
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Get tenant (admin)
      tags:
      - admin
  /admin/tenants/{tenantID}/users:
    get:
      description: Returns users in the target tenant with computed group_membership_count.
        Tri-state ?is_active. Pagination via ?page&per_page; ?q matches email/name
        (ILIKE); ?sort=<field> with `-` prefix or ?order=asc|desc.
      parameters:
      - description: Tenant ID
        in: path
        name: tenantID
        required: true
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 50, max 100)
        in: query
        name: per_page
        type: integer
      - description: Search term — ILIKE match on email/name
        in: query
        name: q
        type: string
      - description: 'Tri-state active-flag filter: true (active only), false (inactive
          only), or omit the param entirely for no filter. Unknown values are ignored.'
        in: query
        name: is_active
        type: boolean
      - description: 'Sort field: email|name|created_at|last_login_at|is_active (prefix
          with - for desc)'
        in: query
        name: sort
        type: string
      - description: 'Sort direction override: asc|desc (wins over `-` prefix)'
        in: query
        name: order
        type: string
      produces:
      - application/vnd.api+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/jsonapi.AdminUsersResponse'
        "401":
          description: Unauthorized - back-office authentication required
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "403":
          description: Account disabled
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "404":
          description: Tenant not found
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: List users for a tenant (admin)
      tags:
      - admin
  /admin/users/{userID}:
    get:
      description: 'Returns the user detail across tenants: identity, is_active, last_login_at,
        group memberships (group_id, group_slug, group_name, role, joined_at), and
        active_session_count from unrevoked refresh tokens. No password hash.'
      parameters:
      - description: User ID
        in: path
        name: userID
        required: true
        type: string
      produces:
      - application/vnd.api+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/jsonapi.AdminUserResponse'
        "401":
          description: Unauthorized - back-office authentication required
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "403":
          description: Account disabled
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Get user (admin)
      tags:
      - admin
  /admin/users/{userID}/block:
    post:
      consumes:
      - application/json
      description: |-
        Sets the user's `is_active` flag to false, revokes every refresh token, and bumps the JWT-blacklist staleness threshold so live access tokens are rejected on next use.
        Returns 422 with `admin.block.self_blocked` when the caller targets their own account, and 422 with `admin.block.admin_requires_force` when targeting another system admin without `force=true`.
        Body-validation rejections surface as 422 with `admin.block.reason_required` (missing or blank `reason`) or `admin.block.reason_too_long` (reason exceeds 500 characters).
      parameters:
      - description: Target user ID
        in: path
        name: userID
        required: true
        type: string
      - description: Block request
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/apiserver.AdminBlockRequest'
      produces:
      - application/vnd.api+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apiserver.AdminUserEnvelope'
        "400":
          description: Bad Request - invalid body
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "401":
          description: Unauthorized - back-office authentication required
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "403":
          description: Account disabled
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "404":
          description: Not Found - unknown user
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "422":
          description: Unprocessable Entity - self-block or admin-on-admin without
            force
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Block (deactivate) a user account
      tags:
      - admin
  /admin/users/{userID}/impersonate:
    post:
      consumes:
      - application/json
      description: |-
        Issues a short-lived impersonation access token for the target tenant user on behalf of the calling back-office operator.
        The token carries `imp=true`, `impersonator_id=<backoffice user id>`, `impersonator_type=backoffice_user`, and
        `is_system_admin=false`; it cannot be refreshed and cannot start a nested impersonation. The operator's own
        `backoffice_refresh_token` cookie is captured server-side at start and restored by POST /admin/impersonation/end.
        Returns 422 with `admin.impersonate.target_is_admin` when the target is a system admin,
        `admin.impersonate.target_blocked` when the target account is blocked, and `admin.impersonate.nested`
        when the caller is already impersonating. Returns 429 with `admin.impersonate.rate_limited` when the
        per-operator start rate limit (10/hour) is exceeded.
      parameters:
      - description: Target tenant user ID
        in: path
        name: userID
        required: true
        type: string
      - description: Optional impersonation reason
        in: body
        name: data
        schema:
          $ref: '#/definitions/apiserver.ImpersonateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apiserver.LoginResponse'
        "400":
          description: Bad Request - invalid body
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "403":
          description: Forbidden - platform_admin role required
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "404":
          description: Not Found - unknown tenant user
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "422":
          description: Unprocessable Entity - target is admin / blocked / nested impersonation
            / reason too long
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "429":
          description: Too Many Requests - per-operator rate limit
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Start an impersonation session (back-office operator)
      tags:
      - admin
  /admin/users/{userID}/sessions/revoke:
    post:
      consumes:
      - application/json
      description: 'Revokes the user''s refresh tokens and blacklists access tokens
        issued before now, without changing whether the account is active. The user
        can sign in again immediately. Idempotent: a user with no live sessions is
        a 200.'
      parameters:
      - description: User ID
        in: path
        name: userID
        required: true
        type: string
      - description: Reason for ending the sessions
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apiserver.AdminRevokeSessionsRequest'
      produces:
      - application/vnd.api+json
      responses:
        "200":
          description: Sessions revoked
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Missing user id or malformed body
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "401":
          description: Back-office authentication required
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "404":
          description: No such user
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "422":
          description: Reason missing or too long
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "500":
          description: Revocation failed
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: End every session for a user
      tags:
      - admin
  /admin/users/{userID}/unblock:
    post:
      consumes:
      - application/json
      description: |-
        Sets the user's `is_active` flag back to true. Does NOT re-issue tokens — the user must log in again.
        Does NOT clear the JWT-blacklist staleness threshold either, so any access tokens that were issued before the block stay rejected until the iat-staleness ring expires.
        Body-validation rejections surface as 422 with `admin.block.reason_required` (missing or blank `reason`) or `admin.block.reason_too_long` (reason exceeds 500 characters); the codes are shared with the block endpoint.
      parameters:
      - description: Target user ID
        in: path
        name: userID
        required: true
        type: string
      - description: Unblock request
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/apiserver.AdminUnblockRequest'
      produces:
      - application/vnd.api+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apiserver.AdminUserEnvelope'
        "400":
          description: Bad Request - invalid body
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "401":
          description: Unauthorized - back-office authentication required
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "403":
          description: Account disabled
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "404":
          description: Not Found - unknown user
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "422":
          description: Unprocessable Entity - invalid reason
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Unblock (reactivate) a user account
      tags:
      - admin
  /admin/workers:
    get:
      description: Returns one resource per canonical worker type with its soft-pause
        state (#1308). A worker with no control row renders as paused=false. Resource
        `type` is "worker_control"; `id` is the worker-type string.
      produces:
      - application/vnd.api+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apiserver.WorkerControlListEnvelope'
        "401":
          description: Unauthorized - back-office authentication required
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "403":
          description: Account disabled
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: List background workers and their pause state (admin)
      tags:
      - admin
  /admin/workers/{workerType}/pause:
    post:
      consumes:
      - application/json
      description: |-
        Soft-pauses the worker named by {workerType} (#1308): its run loop keeps ticking but skips claiming new work until resumed; in-flight jobs finish. Idempotent.
        The optional `reason` body field is recorded on the control row and the audit breadcrumb. An empty body is accepted.
        Unknown worker types return 404 with `admin.worker.unknown_type`; a reason over 500 characters returns 422 with `admin.worker.reason_too_long`.
      parameters:
      - description: Worker type (e.g. export, import, thumbnail)
        in: path
        name: workerType
        required: true
        type: string
      - description: Optional pause request (reason)
        in: body
        name: data
        schema:
          $ref: '#/definitions/apiserver.WorkerPauseRequest'
      produces:
      - application/vnd.api+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apiserver.WorkerControlEnvelope'
        "400":
          description: Bad Request - invalid body
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "401":
          description: Unauthorized - back-office authentication required
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "403":
          description: Account disabled
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "404":
          description: Not Found - unknown worker type
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "422":
          description: Unprocessable Entity - reason too long
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Soft-pause a background worker (admin)
      tags:
      - admin
  /admin/workers/{workerType}/resume:
    post:
      description: Clears the soft-pause on the worker named by {workerType} (#1308)
        so it resumes claiming work on its next tick. Idempotent. Unknown worker types
        return 404 with `admin.worker.unknown_type`.
      parameters:
      - description: Worker type (e.g. export, import, thumbnail)
        in: path
        name: workerType
        required: true
        type: string
      produces:
      - application/vnd.api+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apiserver.WorkerControlEnvelope'
        "401":
          description: Unauthorized - back-office authentication required
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "403":
          description: Account disabled
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "404":
          description: Not Found - unknown worker type
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Resume a soft-paused background worker (admin)
      tags:
      - admin
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: Change the authenticated user's password. All existing sessions
        are invalidated on success.
      parameters:
      - description: Change password request
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/apiserver.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
      summary: Change password
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate a user with email and password. Issues an access token
        in the response body and sets a refresh token as an httpOnly cookie.
      parameters:
      - description: Login credentials
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/apiserver.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apiserver.LoginResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized - invalid credentials
          schema:
            type: string
        "403":
          description: Forbidden - account disabled
          schema:
            type: string
        "429":
          description: Too Many Requests - account locked
          schema:
            type: string
      summary: Login
      tags:
      - auth
  /auth/login/mfa:
    post:
      consumes:
      - application/json
      description: Exchange a short-lived mfa_token + TOTP/backup code for an access
        token.
      parameters:
      - description: MFA challenge response
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/apiserver.LoginMFARequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apiserver.LoginResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
      summary: Complete login with MFA
      tags:
      - auth
  /auth/logout:
    post:
      description: Revoke the current session's access token and clear the refresh
        token cookie.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apiserver.LogoutResponse'
      summary: Logout
      tags:
      - auth
  /auth/magic-link/request:
    post:
      consumes:
      - application/json
      description: Send a passwordless sign-in link to the given email address. Always
        returns 200 to prevent email enumeration. Returns 404 when magic-link login
        is disabled for this deployment.
      parameters:
      - description: Email address
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/apiserver.MagicLinkRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            type: string
        "404":
          description: Not Found - magic-link login disabled
          schema:
            type: string
        "429":
          description: Too Many Requests
          schema:
            type: string
      summary: Request a magic-link sign-in
      tags:
      - auth
  /auth/magic-link/verify:
    post:
      consumes:
      - application/json
      description: Exchange a one-time sign-in token for a session. Returns the same
        shapes as /auth/login (LoginResponse, or LoginMFARequiredResponse when MFA
        is enabled). Returns 404 when magic-link login is disabled.
      parameters:
      - description: Sign-in token
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/apiserver.MagicLinkVerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apiserver.LoginResponse'
        "400":
          description: Bad Request - missing, invalid, or expired token
          schema:
            type: string
        "403":
          description: Forbidden - account disabled
          schema:
            type: string
        "404":
          description: Not Found - magic-link login disabled
          schema:
            type: string
        "429":
          description: Too Many Requests - account locked
          schema:
            type: string
      summary: Verify a magic-link sign-in
      tags:
      - auth
  /auth/me:
    delete:
      consumes:
      - application/json
      description: |-
        Permanently delete the authenticated user's account. Private groups and their content are purged.
        Password re-authentication is required for password-based accounts; OAuth-only accounts can omit it. All sessions are invalidated. Irreversible.
      parameters:
      - description: Account deletion request
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/apiserver.DeleteAccountRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Delete account
      tags:
      - auth
    get:
      description: Return the currently authenticated user's profile. Also refreshes
        the CSRF token in the X-CSRF-Token response header.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "401":
          description: Unauthorized
          schema:
            type: string
      summary: Get current user
      tags:
      - auth
    put:
      consumes:
      - application/json
      description: |-
        Update the authenticated user's profile. The name field is required;
        default_group_id (#1263, #1592) is optional — send a group UUID the
        user is a member of to set, or null to clear (only allowed when the
        user has zero memberships; otherwise rejected with 400). Email, role,
        tenant_id, and is_active are ignored even if submitted.
      parameters:
      - description: Profile update request
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/jsonapi.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
      summary: Update current user profile
      tags:
      - auth
  /auth/me/avatar:
    delete:
      description: 'Clears the caller''s avatar and deletes the stored image. Idempotent:
        removing an avatar that is not there succeeds.'
      produces:
      - application/json
      responses:
        "204":
          description: Removed
        "401":
          description: Authentication required
          schema:
            type: string
      summary: Remove the profile photo
      tags:
      - auth
    get:
      produces:
      - image/jpeg
      responses:
        "200":
          description: The avatar image
          schema:
            type: file
        "401":
          description: Authentication required
          schema:
            type: string
        "404":
          description: No avatar set
          schema:
            type: string
      summary: Get your own profile photo
      tags:
      - auth
    post:
      consumes:
      - multipart/form-data
      description: |-
        Replaces the caller's avatar. The image is center-cropped to a square, scaled to 512px and re-encoded as JPEG, which also drops any EXIF metadata the original carried.
        Accepts a still JPEG, PNG or WebP up to 2 MB, detected from the content rather than from the declared type or the filename. The EXIF orientation is applied to the pixels before the metadata is dropped.
      parameters:
      - description: Image file
        in: formData
        name: avatar
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: The stored avatar path and a signed URL to load it from
          schema:
            $ref: '#/definitions/apiserver.AvatarUploadResponse'
        "400":
          description: Not a supported image, animated, or larger than 2 MB
          schema:
            type: string
        "401":
          description: Authentication required
          schema:
            type: string
      summary: Upload a profile photo
      tags:
      - auth
  /auth/mfa/disable:
    post:
      consumes:
      - application/json
      description: Remove the user's MFA enrollment. Requires password + a current
        TOTP code or unused backup code.
      parameters:
      - description: Disable request
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/apiserver.MFADisableRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            type: string
        "422":
          description: Invalid credentials or code
          schema:
            type: string
      summary: Disable MFA
      tags:
      - auth
  /auth/mfa/regenerate-backup-codes:
    post:
      consumes:
      - application/json
      description: Invalidate the existing backup codes and return a fresh set. Requires
        a current TOTP code.
      parameters:
      - description: Current TOTP code
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/apiserver.MFAVerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apiserver.MFAVerifyResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
        "422":
          description: Invalid code
          schema:
            type: string
      summary: Regenerate MFA backup codes
      tags:
      - auth
  /auth/mfa/setup:
    post:
      description: Generate a TOTP secret for the authenticated user and return the
        QR provisioning URL. Does not enable MFA yet — a follow-up call to /auth/mfa/verify
        is required.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apiserver.MFASetupResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
      summary: Begin MFA enrollment
      tags:
      - auth
  /auth/mfa/status:
    get:
      description: Return whether the authenticated user has TOTP enrolled and enabled.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apiserver.MFAStatusResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
      summary: Get MFA status
      tags:
      - auth
  /auth/mfa/verify:
    post:
      consumes:
      - application/json
      description: Verify the first TOTP code, enable MFA, and return single-use backup
        codes (shown ONCE).
      parameters:
      - description: Verification code
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/apiserver.MFAVerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apiserver.MFAVerifyResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "422":
          description: Invalid code
          schema:
            type: string
      summary: Complete MFA enrollment
      tags:
      - auth
  /auth/oauth/{provider}:
    delete:
      description: Removes the identity row mapping the caller to the named provider.
        Refused with 409 if it is the caller's only remaining sign-in method.
      parameters:
      - description: Provider name (google|github|oidc)
        in: path
        name: provider
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Unknown provider
          schema:
            type: string
        "409":
          description: Conflict - cannot remove the last remaining sign-in method
          schema:
            type: string
      summary: Unlink an OAuth provider from the caller's account
      tags:
      - oauth
  /auth/oauth/{provider}/callback:
    get:
      description: |-
        Validates state + cookie, exchanges the code, and either signs the caller in (existing identity),
        auto-links a verified-email match, prompts a password sign-in (unverified email), or creates a new
        account when the tenant's registration mode allows it (open: active, approval: inactive until an
        administrator activates it, closed: refused). Redirects to the FE path the state carried after a
        sign-in. Every other outcome redirects to /login instead, whatever path the state carried: a refusal
        with ?oauth_error=<code> (for example registration_closed, account_disabled, email_unverified), an
        account waiting for approval with ?oauth_error=pending_approval, an unverified email match with
        ?oauth_link_required=1, and an MFA-enrolled user with ?mfa_required=1.
      parameters:
      - description: Provider name (google|github|oidc)
        in: path
        name: provider
        required: true
        type: string
      - description: Authorization code returned by the provider
        in: query
        name: code
        required: true
        type: string
      - description: Signed state token issued by /start
        in: query
        name: state
        required: true
        type: string
      responses:
        "302":
          description: Redirect to the FE redirect path the state carried
        "400":
          description: Bad Request - invalid state or code
          schema:
            type: string
        "404":
          description: Unknown provider
          schema:
            type: string
        "500":
          description: Internal error during exchange or user provisioning
          schema:
            type: string
      summary: OAuth callback (provider redirect target)
      tags:
      - oauth
  /auth/oauth/{provider}/link/start:
    get:
      description: |-
        Authenticated variant of /start: the resulting callback links the new identity to the caller's user rather than creating a fresh account.
        The caller is identified from the refresh-token cookie (or an Authorization Bearer header); an absent or expired session 302s to /login.
      parameters:
      - description: Provider name (google|github|oidc)
        in: path
        name: provider
        required: true
        type: string
      - description: Relative FE path to land on after link
        in: query
        name: redirect
        type: string
      responses:
        "302":
          description: Redirect to provider (or to /login when no live session is
            present)
        "404":
          description: Unknown provider
          schema:
            type: string
        "500":
          description: Internal error generating the PKCE/state token
          schema:
            type: string
        "502":
          description: The OpenID Connect provider's discovery document could not
            be fetched
          schema:
            type: string
      summary: Start link-an-additional-OAuth-provider flow
      tags:
      - oauth
  /auth/oauth/{provider}/start:
    get:
      description: Begins the authorization-code flow against the named provider.
        The handler signs short-lived state + PKCE pair and 302s the browser to the
        provider's consent screen.
      parameters:
      - description: Provider name (google|github|oidc)
        in: path
        name: provider
        required: true
        type: string
      - description: Relative FE path to land on after sign-in
        in: query
        name: redirect
        type: string
      responses:
        "302":
          description: Redirect to provider
        "404":
          description: Unknown provider
          schema:
            type: string
        "500":
          description: Internal error generating state token
          schema:
            type: string
        "502":
          description: The OpenID Connect provider's discovery document could not
            be fetched (sign-in redirects to /login?oauth_error=provider instead)
          schema:
            type: string
      summary: Start OAuth sign-in flow
      tags:
      - oauth
  /auth/oauth/identities:
    get:
      description: Returns each OAuth provider the authenticated user has linked along
        with the email recorded at link time.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apiserver.linkedIdentitiesResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
      summary: List the caller's linked OAuth identities
      tags:
      - oauth
  /auth/oauth/providers:
    get:
      description: Returns the providers operators have configured (Google, GitHub,
        and one OpenID Connect provider named "oidc" whose display_name the operator
        sets). Empty list when OAuth is not configured.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apiserver.providerListResponse'
      summary: List OAuth providers enabled in this deployment
      tags:
      - oauth
  /auth/refresh:
    post:
      description: |-
        Issue a new short-lived access token using the refresh token stored in the httpOnly cookie. Rotates the refresh token: the consumed cookie value is revoked and a new value is set.
        Replaying an already-rotated cookie is treated as theft and revokes all of the user's sessions.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apiserver.LoginResponse'
        "401":
          description: Unauthorized - missing, invalid, or expired refresh token
          schema:
            type: string
        "501":
          description: Not Implemented - refresh tokens not supported
          schema:
            type: string
      summary: Refresh access token
      tags:
      - auth
  /avatars/{userID}:
    get:
      description: |-
        Serves the photo a signed avatar_url points at. The /auth/me and group members responses carry those URLs;
        they are bound to the session that received them and expire. The signature is the credential, so no bearer token is needed.
      parameters:
      - description: The user whose photo it is
        in: path
        name: userID
        required: true
        type: string
      - description: Photo version
        in: query
        name: v
        required: true
        type: string
      - description: The user the URL was issued to
        in: query
        name: uid
        required: true
        type: string
      - description: The group the two users share
        in: query
        name: gid
        type: string
      - description: Expiry, Unix seconds
        in: query
        name: exp
        required: true
        type: integer
      - description: Signature
        in: query
        name: sig
        required: true
        type: string
      produces:
      - image/jpeg
      responses:
        "200":
          description: The avatar image
          schema:
            type: file
        "401":
          description: Invalid or expired URL
          schema:
            type: string
        "404":
          description: No such photo, or no longer visible to this user
          schema:
            type: string
      summary: Get a profile photo from a signed URL
      tags:
      - auth
  /backoffice/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate a back-office (platform-operator) user with email
        + password. Issues a `backoffice` aud access token in the body and sets a
        `backoffice_refresh_token` cookie at `/api/v1/backoffice`.
      parameters:
      - description: Login credentials
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/apiserver.BackofficeLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apiserver.BackofficeLoginResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized - invalid credentials
          schema:
            type: string
        "429":
          description: Too Many Requests - account locked
          schema:
            type: string
        "501":
          description: Not Implemented - MFA enforced but not yet wired (Phase 4)
          schema:
            $ref: '#/definitions/apiserver.BackofficeMFARequiredResponse'
      summary: Back-office login
      tags:
      - backoffice-auth
  /backoffice/auth/login/mfa:
    post:
      consumes:
      - application/json
      description: Exchange a short-lived MFA challenge token + TOTP/backup code for
        a back-office access token. Issues a `backoffice` aud access token in the
        body and sets a `backoffice_refresh_token` cookie at `/api/v1/backoffice`.
      parameters:
      - description: MFA challenge response
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/apiserver.BackofficeLoginMFARequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apiserver.BackofficeLoginResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized — invalid token or code
          schema:
            type: string
        "429":
          description: Too Many Requests — account locked
          schema:
            type: string
        "501":
          description: MFA not configured
          schema:
            type: string
      summary: Complete back-office login with MFA
      tags:
      - backoffice-auth
  /backoffice/auth/logout:
    post:
      description: Revoke the current back-office session's refresh token and clear
        the cookie.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apiserver.BackofficeLogoutResponse'
      summary: Back-office logout
      tags:
      - backoffice-auth
  /backoffice/auth/me:
    get:
      description: Return the currently authenticated back-office user's profile.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apiserver.BackofficeProfile'
        "401":
          description: Unauthorized
          schema:
            type: string
      summary: Get current back-office user
      tags:
      - backoffice-auth
  /backoffice/auth/refresh:
    post:
      description: 'Issue a new back-office access token using the `backoffice_refresh_token`
        cookie. Rotates the refresh token: the consumed cookie value is revoked and
        a new value is set.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apiserver.BackofficeLoginResponse'
        "401":
          description: Unauthorized
          schema:
            type: string
        "501":
          description: Refresh tokens not supported (registry not configured)
          schema:
            type: string
      summary: Refresh back-office access token
      tags:
      - backoffice-auth
  /backup/public-key:
    get:
      description: |-
        Returns the server's backup-signing public key (PEM), its fingerprint, and the signing algorithm.
        The private key is never exposed — only the public half, so external tooling can verify a `.inb`
        archive's signature without being able to forge one (#534).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apiserver.BackupPublicKeyResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Get backup signing public key
      tags:
      - system
  /currencies:
    get:
      consumes:
      - application/vnd.api+json
      description: get list of supported currencies
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
      summary: Get supported currencies
      tags:
      - currencies
  /feature-flags:
    get:
      description: Returns the deployment-scoped feature-flag state. Public (no auth)
        — flags describe deployment posture, not per-user authorization. Used by the
        FE at boot to hide entry points for features whose backend is gated off (#1616).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apiserver.FeatureFlags'
      summary: Get deployment feature flags
      tags:
      - system
  /feedback:
    post:
      consumes:
      - application/json
      description: Forward an authenticated user's in-app feedback / bug report /
        feature request to the operator-configured support inbox. Per-user rate-limited
        (5/hour).
      parameters:
      - description: Feedback payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/apiserver.FeedbackRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/apiserver.FeedbackResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "429":
          description: Too Many Requests
          schema:
            type: string
        "503":
          description: Feedback not configured
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Submit feedback
      tags:
      - feedback
  /files/download/files/{fileID}:
    get:
      description: Download the original file content by file ID. Requires a valid
        signed URL token.
      parameters:
      - description: File ID
        in: path
        name: fileID
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: File content
          schema:
            type: file
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Download original file
      tags:
      - files
  /files/download/thumbnails/{fileID}/{size}:
    get:
      description: Download a JPEG thumbnail for the specified file. Returns a placeholder
        image while the thumbnail is being generated.
      parameters:
      - description: File ID
        in: path
        name: fileID
        required: true
        type: string
      - description: Thumbnail size
        enum:
        - small
        - medium
        - large
        in: path
        name: size
        required: true
        type: string
      produces:
      - image/jpeg
      responses:
        "200":
          description: Thumbnail image
          schema:
            type: file
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Download file thumbnail
      tags:
      - files
  /forgot-password:
    post:
      consumes:
      - application/json
      description: Send a password-reset link to the given email address. Always returns
        200 to prevent email enumeration.
      parameters:
      - description: Email address
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/apiserver.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            type: string
        "429":
          description: Too Many Requests
          schema:
            type: string
      summary: Request a password reset
      tags:
      - auth
  /g/{groupSlug}/areas:
    get:
      consumes:
      - application/vnd.api+json
      description: get areas, optionally filtered to a single location.
      parameters:
      - description: Group slug
        in: path
        name: groupSlug
        required: true
        type: string
      - description: Restrict the result to areas inside the given location ID. Unknown
          / cross-tenant IDs return an empty list rather than 4xx.
        in: query
        name: location_id
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 50, max 100)
        in: query
        name: per_page
        type: integer
      produces:
      - application/vnd.api+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/jsonapi.AreasResponse'
      summary: List areas
      tags:
      - areas
    post:
      consumes:
      - application/vnd.api+json
      description: add by area data
      parameters:
      - description: Group slug
        in: path
        name: groupSlug
        required: true
        type: string
      - description: Area object
        in: body
        name: area
        required: true
        schema:
          $ref: '#/definitions/jsonapi.AreaRequest'
      produces:
      - application/vnd.api+json
      responses:
        "201":
          description: Area created
          schema:
            $ref: '#/definitions/jsonapi.AreaResponse'
        "404":
          description: Area not found
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "422":
          description: User-side request problem
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Create a new area
      tags:
      - areas
  /g/{groupSlug}/areas/{areaID}:
    delete:
      consumes:
      - application/vnd.api+json
      description: Delete by area ID
      parameters:
      - description: Group slug
        in: path
        name: groupSlug
        required: true
        type: string
      - description: Area ID
        in: path
        name: areaID
        required: true
        type: string
      - description: 'Non-empty-area strategy: cascade deletes the commodities, unlink
          keeps them area-less. Omit to reject a non-empty area.'
        enum:
        - cascade
        - unlink
        in: query
        name: strategy
        type: string
      produces:
      - application/vnd.api+json
      responses:
        "204":
          description: No content
        "404":
          description: Area not found
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "422":
          description: Non-empty area (no strategy) or unknown strategy
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Delete an area
      tags:
      - areas
    get:
      consumes:
      - application/vnd.api+json
      description: get area by ID
      parameters:
      - description: Group slug
        in: path
        name: groupSlug
        required: true
        type: string
      - description: Area ID
        in: path
        name: areaID
        required: true
        type: string
      produces:
      - application/vnd.api+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/jsonapi.AreaResponse'
      summary: Get an area
      tags:
      - areas
    put:
      consumes:
      - application/vnd.api+json
      description: Update by area data
      parameters:
      - description: Group slug
        in: path
        name: groupSlug
        required: true
        type: string
      - description: Area ID
        in: path
        name: areaID
        required: true
        type: string
      - description: Area object
        in: body
        name: area
        required: true
        schema:
          $ref: '#/definitions/jsonapi.AreaRequest'
      produces:
      - application/vnd.api+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/jsonapi.AreaResponse'
        "404":
          description: Area not found
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "422":
          description: User-side request problem
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Update a area
      tags:
      - areas
  /g/{groupSlug}/commodities:
    get:
      consumes:
      - application/vnd.api+json
      description: get commodities
      parameters:
      - description: Group slug
        in: path
        name: groupSlug
        required: true
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 50, max 100)
        in: query
        name: per_page
        type: integer
      - collectionFormat: multi
        description: Filter by commodity type; repeat to OR
        in: query
        items:
          type: string
        name: type
        type: array
      - collectionFormat: multi
        description: Filter by status (in_use, sold, lost, disposed, written_off);
          repeat to OR
        in: query
        items:
          type: string
        name: status
        type: array
      - description: Filter by exact area ID
        in: query
        name: area_id
        type: string
      - description: Only commodities with no area (ignored when area_id is set)
        in: query
        name: unassigned
        type: boolean
      - collectionFormat: multi
        description: Filter by seller ID; repeat for several (OR)
        in: query
        items:
          type: string
        name: seller_id
        type: array
      - description: 'Search text: space-separated terms, quotes keep a phrase; every
          term must match the name, short name, brand, model, a serial or part number,
          a tag, a note or the asset ID. At most 200 characters and 10 terms'
        in: query
        name: q
        type: string
      - collectionFormat: multi
        description: Only items with these tag slugs (comma-separated or repeated);
          see tag_mode
        in: query
        items:
          type: string
        name: tags
        type: array
      - description: 'How tags combine: all (default) or any'
        enum:
        - all
        - any
        in: query
        name: tag_mode
        type: string
      - collectionFormat: multi
        description: Only items with none of these tag slugs (comma-separated or repeated)
        in: query
        items:
          type: string
        name: tags_exclude
        type: array
      - description: Only items with no tags; cannot be combined with tags or tags_exclude
        in: query
        name: no_tags
        type: boolean
      - description: Include drafts and non-in_use commodities (default true; false
          hides them)
        in: query
        name: include_inactive
        type: boolean
      - description: Sort field — name|registered_date|purchase_date|current_price|original_price|count,
          prefix with '-' for descending
        in: query
        name: sort
        type: string
      - collectionFormat: multi
        description: Filter by computed warranty status (active, expiring, expired,
          none); repeat to OR
        in: query
        items:
          type: string
        name: warranty_status
        type: array
      - description: Restrict to commodities whose warranty expires strictly before
          YYYY-MM-DD
        in: query
        name: warranty_expires_before
        type: string
      - description: 'Filter by current loan state: true = only currently lent (open
          loan), false = only currently not-lent'
        in: query
        name: lent_out
        type: boolean
      - description: true lists the items in Trash instead of the live ones (default
          false); cannot be combined with lent_out
        in: query
        name: trashed
        type: boolean
      produces:
      - application/vnd.api+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/jsonapi.CommoditiesResponse'
        "400":
          description: Unsupported parameter or invalid value
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: List commodities
      tags:
      - commodities
    post:
      consumes:
      - application/vnd.api+json
      description: Add a new commodity
      parameters:
      - description: Group slug
        in: path
        name: groupSlug
        required: true
        type: string
      - description: Commodity object
