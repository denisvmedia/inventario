  /g/{groupSlug}/commodities/bulk-delete:
    post:
      consumes:
      - application/vnd.api+json
      description: |-
        Move the selected items to Trash, each as DELETE /commodities/{id} does: with the files no other item, area or location uses, and a deleted event in its history.
        The items are given as ids (at most 100) or as a query of the item query contract with the count and digest of the items it was seen to select (at most 500); see POST /commodities/bulk-update for the selection rules.
        The response lists succeeded and failed ids. An item that went to Trash while moving its files there failed is succeeded, with a files_kept note.
        A retry sends the failed ids as `ids`, in batches of at most 100.
      parameters:
      - description: Group slug
        in: path
        name: groupSlug
        required: true
        type: string
      - description: The items to delete
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/jsonapi.CommodityBulkDeleteRequest'
      produces:
      - application/vnd.api+json
      responses:
        "200":
          description: Per-id outcome
          schema:
            $ref: '#/definitions/jsonapi.BulkResultResponse'
        "400":
          description: The query is not a valid item query, or selects items in Trash
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "409":
          description: 'bulk.selection_changed: the query selects at most 500 items,
            but other ones than expected_count and expected_digest describe'
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "422":
          description: 'Bad request body, or bulk.too_many: the query selects more
            than 500 items (checked before the 409)'
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Bulk-delete commodities
      tags:
      - commodities
  /g/{groupSlug}/commodities/bulk-move:
    post:
      consumes:
      - application/vnd.api+json
      description: |-
        Put the selected items into the area area_id. An item already in that area is reported as skipped. Each moved item gets a moved event in its history.
        An area_id that is not an area of the group is refused with 422 before any item changes.
        The items are given as ids (at most 100) or as a query of the item query contract with the count and digest of the items it was seen to select (at most 500); see POST /commodities/bulk-update for the selection rules.
        A retry sends the same area_id with the failed ids as `ids`, in batches of at most 100.
      parameters:
      - description: Group slug
        in: path
        name: groupSlug
        required: true
        type: string
      - description: The items and the destination area_id
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/jsonapi.BulkMoveRequest'
      produces:
      - application/vnd.api+json
      responses:
        "200":
          description: Per-id outcome
          schema:
            $ref: '#/definitions/jsonapi.BulkResultResponse'
        "400":
          description: The query is not a valid item query, or selects items in Trash
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "409":
          description: 'bulk.selection_changed: the query selects at most 500 items,
            but other ones than expected_count and expected_digest describe'
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "422":
          description: 'Bad request body, an area_id that is not an area of the group,
            or bulk.too_many: the query selects more than 500 items (checked before
            the 409)'
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Bulk-move commodities to a new area
      tags:
      - commodities
  /g/{groupSlug}/commodities/bulk-update:
    post:
      consumes:
      - application/vnd.api+json
      description: |-
        Apply one patch to the selected items. Each item is changed and validated as PUT /commodities/{id} changes it, and gets the history events that edit would give it:
        a status change event when its status changes, and an updated event when only its tags or type change. As for PUT, a status change event stands for the whole change,
        so a type or tag change in the same patch gets no event of its own.

        The patch: `tags.add` and `tags.remove` add and remove tags without touching the others
        (`add` takes slugs or the text of a new tag, at most 50 per list); `type` sets the type;
        `status` sets the status with `date` (required for every status but in_use) and an optional `note`.
        `in_use` takes neither: send it without `date` and `note` (a non-empty one is refused with 422), and it clears
        the status date, note and sale price. `sold` is refused, since it needs a sale price for each item.
        An item that already has the status keeps its status date and note: the patch does not change them,
        even when it sends another date or note. The other parts of the patch still apply to that item.
        A part left out of the patch is left unchanged.

        The items are given as `ids` (at most 100) or as `query`, a query string of the item query contract
        (the filter parameters of GET /commodities, without page and per_page), with `expected_count` and
        `expected_digest`: the number of items the caller saw it select and the `meta.selection_digest`
        GET /commodities returned for it. The query is run when the request arrives and may select no items
        in Trash. When it now selects more than 500 items, the request fails with 422 bulk.too_many; this
        check comes first, so a set that grew past 500 is a 422, not a 409. When it selects other items
        within that limit (more, fewer, or as many with one swapped), the request fails with 409
        bulk.selection_changed. Either way nothing changes.

        The response lists, per item, whether it changed (succeeded), no part of the patch changed it (skipped) or it could not be changed (failed, with a code and the reason).
        To retry, send the same patch again with the failed ids as `ids`, in batches of at most 100, not the query: after the first run it may select other items, and it also selects the ones that succeeded.
      parameters:
      - description: Group slug
        in: path
        name: groupSlug
        required: true
        type: string
      - description: The items and the patch
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/jsonapi.CommodityBulkUpdateRequest'
      produces:
      - application/vnd.api+json
      responses:
        "200":
          description: Per-id outcome
          schema:
            $ref: '#/definitions/jsonapi.BulkResultResponse'
        "400":
          description: The query is not a valid item query, or selects items in Trash
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "409":
          description: 'bulk.selection_changed: the query selects at most 500 items,
            but other ones than expected_count and expected_digest describe'
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "422":
          description: 'Bad request body or patch, or bulk.too_many: the query selects
            more than 500 items (checked before the 409)'
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Bulk-update commodities
      tags:
      - commodities
  /g/{groupSlug}/commodities/scan:
    post:
      consumes:
      - multipart/form-data
      description: Extract structured commodity field guesses from 1..N product photos
        or PDF documents. The handler does not persist any commodity — it only returns
        structured suggestions for the Add Item dialog to pre-fill.
      parameters:
      - description: Group slug
        in: path
        name: groupSlug
        required: true
        type: string
      - description: Product photo(s) or PDF document(s); image/jpeg|jpg|png|webp|heic|heif
          or application/pdf. Repeat the field to upload up to 5 files (multipart/form-data
          with multiple `photos` parts).
        in: formData
        name: photos
        required: true
        type: file
      - description: Optional free-form hint (brand, category guess)
        in: formData
        name: hint
        type: string
      produces:
      - application/vnd.api+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/jsonapi.CommodityScanResponse'
        "413":
          description: File too large
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "415":
          description: Unsupported MIME type
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "422":
          description: Too many files / no files
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "429":
          description: Rate limited
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "502":
          description: Provider unavailable / parse error
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "503":
          description: Provider disabled
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "504":
          description: Provider timed out
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Run an AI vision scan on uploaded photos or documents
      tags:
      - commodities
  /g/{groupSlug}/commodities/tag-counts:
    get:
      consumes:
      - application/vnd.api+json
      description: |-
        Per item tag slug, the number of items the query selects when its own tag filter (tags, tag_mode, tags_exclude, no_tags) is set aside, plus the number without tags.
        Takes the filter parameters of GET /commodities (item query contract); sort is accepted and ignored. An unknown parameter or an unreadable value is a 400.
      parameters:
      - description: Group slug
        in: path
        name: groupSlug
        required: true
        type: string
      - description: Search text, as for GET /commodities
        in: query
        name: q
        type: string
      - collectionFormat: multi
        description: Filter by commodity type, as for GET /commodities
        in: query
        items:
          type: string
        name: type
        type: array
      - collectionFormat: multi
        description: Filter by status, as for GET /commodities
        in: query
        items:
          type: string
        name: status
        type: array
      - description: Filter by exact area ID
        in: query
        name: area_id
        type: string
      - description: Only commodities with no area
        in: query
        name: unassigned
        type: boolean
      - collectionFormat: multi
        description: Filter by seller ID; repeat for several (OR)
        in: query
        items:
          type: string
        name: seller_id
        type: array
      - description: Include drafts and non-in_use commodities (default true)
        in: query
        name: include_inactive
        type: boolean
      - collectionFormat: multi
        description: Filter by computed warranty status
        in: query
        items:
          type: string
        name: warranty_status
        type: array
      - description: Warranty expires strictly before YYYY-MM-DD
        in: query
        name: warranty_expires_before
        type: string
      - description: Filter by current loan state
        in: query
        name: lent_out
        type: boolean
      - description: Count the items in Trash instead of the live ones (default false);
          cannot be combined with lent_out
        in: query
        name: trashed
        type: boolean
      - collectionFormat: multi
        description: Validated as for GET /commodities, then set aside for the counts
        in: query
        items:
          type: string
        name: tags
        type: array
      - description: Validated as for GET /commodities, then set aside for the counts
        enum:
        - all
        - any
        in: query
        name: tag_mode
        type: string
      - collectionFormat: multi
        description: Validated as for GET /commodities, then set aside for the counts
        in: query
        items:
          type: string
        name: tags_exclude
        type: array
      - description: Validated as for GET /commodities, then set aside for the counts
        in: query
        name: no_tags
        type: boolean
      - description: Accepted and ignored
        in: query
        name: sort
        type: string
      produces:
      - application/vnd.api+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/jsonapi.CommodityTagCountsResponse'
        "400":
          description: Unsupported parameter or invalid value
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Count commodity tags
      tags:
      - commodities
  /g/{groupSlug}/commodities/values:
    get:
