  jsonapi.CommoditiesMeta:
    properties:
      commodities:
        example: 1
        format: int64
        type: integer
      covers:
        additionalProperties:
          $ref: '#/definitions/jsonapi.CommodityCover'
        description: |-
          Covers maps commodity id → resolved cover image. Empty (omitted) for
          commodities without an attached photo. The FE renders the largest
          thumbnail that fits the slot and falls back to the type emoji when
          the entry is absent. Issue #1451 ships option (A) — first photo by
          `created_at` ASC; option (B) `cover_file_id` override is filed as a
          follow-up sub-issue.
        type: object
      matches:
        additionalProperties:
          items:
            $ref: '#/definitions/registry.CommoditySearchMatch'
          type: array
        description: |-
          Matches maps commodity id → the fields the search text (`q`) was
          found in, so the list can say why an item matched. Omitted when the
          request has no `q`.
        type: object
      page:
        example: 1
        format: int64
        type: integer
      per_page:
        example: 50
        format: int64
        type: integer
      selection_digest:
        description: |-
          SelectionDigest names the set of items the query selects, on every
          page: the hex SHA-256 of their sorted ids (commodityquery.Digest). A
          bulk action on the query sends it back unchanged as expected_digest,
          and is refused when the query no longer selects exactly these items.
          Omitted when the query selects no items, more than a bulk action takes
          (500), or items in Trash, and when the items changed while the list was
          read or the lookup failed; a client then offers no bulk action on the
          query.
        example: 1eb7c54d52831bbfe8942af0b1c56b7409523a59ed6ca99c1174fef7eb32c1b5
        type: string
      total_pages:
        example: 1
        format: int64
        type: integer
    type: object
