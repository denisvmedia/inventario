  /g/{groupSlug}/files/{fileID}/links:
    post:
      consumes:
      - application/vnd.api+json
      description: |-
        Creates a link from the file to the entity and nothing else: no
        new file, no upload, no storage charge. Attaching a file to an
        entity it is already attached to is a no-op and answers 200.
        The entity must be in the same group as the file. A backup
        export file cannot be attached. A draft must be open: a promoted
        draft answers 409 draft.promoted with meta.commodity_id, a draft
        being discarded 409 draft.discarded.
      parameters:
      - description: Group slug
        in: path
        name: groupSlug
        required: true
        type: string
      - description: File ID
        in: path
        name: fileID
        required: true
        type: string
      - description: Entity to attach the file to
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/jsonapi.FileLinkRequest'
      produces:
      - application/vnd.api+json
      responses:
        "200":
          description: Already attached
          schema:
            $ref: '#/definitions/jsonapi.FileResponse'
        "201":
          description: Attached
          schema:
            $ref: '#/definitions/jsonapi.FileResponse'
        "404":
          description: File not found
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "409":
          description: The draft is promoted or being discarded
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "422":
          description: Invalid entity, entity not found, or export file
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Attach a file to an entity
      tags:
      - files
  /g/{groupSlug}/files/{fileID}/links/{linkID}:
    delete:
      consumes:
      - application/vnd.api+json
      description: |-
        Removes the link and nothing else. A file whose last attachment
        is removed stays as a standalone file; deleting it is a separate
        call. Removing the attachment of an item's cover photo clears
        that item's cover choice. The link of a backup export file
        cannot be removed.
      parameters:
      - description: Group slug
        in: path
        name: groupSlug
        required: true
        type: string
      - description: File ID
        in: path
        name: fileID
        required: true
        type: string
      - description: Link ID
        in: path
        name: linkID
        required: true
        type: string
      produces:
      - application/vnd.api+json
      responses:
        "200":
          description: The file with its remaining attachments
          schema:
            $ref: '#/definitions/jsonapi.FileResponse'
        "404":
          description: File or link not found
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "422":
          description: Export link
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Remove a file attachment
      tags:
      - files
