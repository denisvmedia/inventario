  /g/{groupSlug}/files/bulk-delete:
    post:
      consumes:
      - application/vnd.api+json
      description: |-
        Move every file whose id appears in the body to Trash. The
        response lists succeeded vs.
        failed ids so the frontend can render partial-failure UX
        without parsing per-id HTTP statuses.
      parameters:
      - description: Group slug
        in: path
        name: groupSlug
        required: true
        type: string
      - description: List of file IDs to delete
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/jsonapi.BulkIDsRequest'
      produces:
      - application/vnd.api+json
      responses:
        "200":
          description: Per-id outcome
          schema:
            $ref: '#/definitions/jsonapi.BulkResultResponse'
        "422":
          description: Bad request body
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Bulk-delete files
      tags:
      - files
  /g/{groupSlug}/files/bulk-update:
    post:
      consumes:
      - application/vnd.api+json
      description: |-
        Add tags to and remove tags from the files whose ids (at most 100) the body lists. Only the tags change:
        unlike PUT /files/{id}, which replaces the tag list with the one it is sent, tags the patch does not name
        stay on each file, and the title, description and file name stay as they are.
        `tags.add` takes slugs or the text of a new tag, which is created as PUT /files/{id} creates it; `tags.remove` takes slugs.
        A tag cannot be in both lists, and each list holds at most 50 tags.

        The response lists, per file, whether it changed (succeeded), already had what the patch sets (skipped) or could not be changed (failed, with a code and the reason).
        A retry sends the same patch with the failed ids, in batches of at most 100.
      parameters:
      - description: Group slug
        in: path
        name: groupSlug
        required: true
        type: string
      - description: The files and the patch
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/jsonapi.FileBulkUpdateRequest'
      produces:
      - application/vnd.api+json
      responses:
        "200":
          description: Per-id outcome
          schema:
            $ref: '#/definitions/jsonapi.BulkResultResponse'
        "422":
          description: Bad request body or patch
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Bulk-update files
      tags:
      - files
  /g/{groupSlug}/files/category-counts:
    get:
      consumes:
      - application/vnd.api+json
      description: Per-category file counts, respecting the same filters as GET /files
      parameters:
      - description: Group slug
        in: path
        name: groupSlug
        required: true
        type: string
