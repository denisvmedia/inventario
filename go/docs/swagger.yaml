    enum:
    - pending
    - running
    - completed
    - failed
    type: string
    x-enum-varnames:
    - CurrencyMigrationStatusPending
    - CurrencyMigrationStatusRunning
    - CurrencyMigrationStatusCompleted
    - CurrencyMigrationStatusFailed
