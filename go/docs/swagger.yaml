  /g/{groupSlug}/storage-usage:
    get:
      description: Returns the per-group blob byte total with a per-category breakdown
        and the active quota. Used by the Settings → Data & storage card.
      parameters:
      - description: Group slug
        in: path
        name: groupSlug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.StorageUsage'
        "401":
          description: Unauthorized
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Get storage usage for a group
      tags:
      - storage
  /g/{groupSlug}/tags:
    get:
      consumes:
      - application/vnd.api+json
      description: get tags of the given kind. Pass include=usage to attach a per-row
        meta.usage block. kind=commodity|file is required — item-tags and file-tags
        are separate entities.
      parameters:
      - description: Group slug
        in: path
        name: groupSlug
        required: true
        type: string
      - description: Tag kind (commodity = item-tags, file = file-tags)
        enum:
        - commodity
        - file
        in: query
        name: kind
        required: true
        type: string
      - description: Search by label or slug
        in: query
        name: q
        type: string
      - description: Sort field (label, created_at, usage)
        enum:
        - label
        - created_at
        - usage
        in: query
        name: sort
        type: string
      - default: asc
        description: Sort direction (asc, desc)
        in: query
        name: order
        type: string
      - default: 1
        description: Page number (1-based)
        in: query
        name: page
        type: integer
      - default: 50
        description: Items per page
        in: query
        name: per_page
        type: integer
      - description: Comma-separated extras. 'usage' attaches per-row meta.usage.
        enum:
        - usage
        in: query
        name: include
        type: string
      produces:
      - application/vnd.api+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/jsonapi.TagsResponse'
        "422":
          description: Missing or invalid kind value
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: List tags
      tags:
      - tags
    post:
      consumes:
      - application/vnd.api+json
      description: add a tag with slug, label, color
      parameters:
      - description: Group slug
        in: path
        name: groupSlug
        required: true
        type: string
      - description: Tag object
        in: body
        name: tag
        required: true
        schema:
          $ref: '#/definitions/jsonapi.TagRequest'
      produces:
      - application/vnd.api+json
      responses:
        "201":
          description: Tag created
          schema:
            $ref: '#/definitions/jsonapi.TagResponse'
        "422":
          description: User-side request problem
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Create a new tag
      tags:
      - tags
  /g/{groupSlug}/tags/{tagID}:
    delete:
      consumes:
      - application/vnd.api+json
      description: Delete tag by ID. Returns 409 with usage breakdown when in use;
        pass ?force=true to strip references.
      parameters:
      - description: Group slug
        in: path
        name: groupSlug
        required: true
        type: string
      - description: Tag ID
        in: path
        name: tagID
        required: true
        type: string
      - description: Strip JSONB references then delete
        in: query
        name: force
        type: boolean
      produces:
      - application/vnd.api+json
      responses:
        "204":
          description: No content
        "404":
          description: Tag not found
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "409":
          description: Tag is in use; pass force=true to strip references
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Delete a tag
      tags:
      - tags
    get:
      consumes:
      - application/vnd.api+json
      description: get tag by ID with usage breakdown
      parameters:
      - description: Group slug
        in: path
        name: groupSlug
        required: true
        type: string
      - description: Tag ID
        in: path
        name: tagID
        required: true
        type: string
      produces:
      - application/vnd.api+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/jsonapi.TagResponse'
        "404":
          description: Tag not found
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Get a tag
      tags:
      - tags
    patch:
      consumes:
      - application/vnd.api+json
      description: Patch label/color/slug. Slug change rewrites JSONB references.
      parameters:
      - description: Group slug
        in: path
        name: groupSlug
        required: true
        type: string
      - description: Tag ID
        in: path
        name: tagID
        required: true
        type: string
      - description: Tag patch payload
        in: body
        name: tag
        required: true
        schema:
          $ref: '#/definitions/jsonapi.TagUpdateRequest'
      produces:
      - application/vnd.api+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/jsonapi.TagResponse'
        "404":
          description: Tag not found
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "409":
          description: Slug already in use
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "422":
          description: User-side request problem
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Update a tag
      tags:
      - tags
  /g/{groupSlug}/tags/autocomplete:
    get:
      consumes:
      - application/vnd.api+json
      description: Top-N tags of the given kind matching the query, ranked by usage
        desc + created_at desc.
      parameters:
      - description: Group slug
        in: path
        name: groupSlug
        required: true
        type: string
      - description: Tag kind (commodity = item-tags, file = file-tags)
        enum:
        - commodity
        - file
        in: query
        name: kind
        required: true
        type: string
      - description: Substring match against label and slug
        in: query
        name: q
        type: string
      - default: 10
        description: Maximum suggestions returned
        in: query
        name: limit
        type: integer
      produces:
      - application/vnd.api+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/jsonapi.TagAutocompleteResponse'
        "422":
          description: Missing or invalid kind value
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Autocomplete tag suggestions
      tags:
      - tags
  /g/{groupSlug}/tags/stats:
    get:
      consumes:
      - application/vnd.api+json
      description: Returns total tags, plus tagged/untagged counts on commodities
        and files for the current group.
      parameters:
      - description: Group slug
        in: path
        name: groupSlug
        required: true
        type: string
      produces:
      - application/vnd.api+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/jsonapi.TagStatsResponse'
      summary: Tag adoption stats
      tags:
      - tags
  /g/{groupSlug}/trash:
    delete:
      description: |-
        Deletes every item and file in the group's Trash for good.
        Requires the admin or owner role.
      parameters:
      - description: Group slug
        in: path
        name: groupSlug
        required: true
        type: string
      produces:
      - application/vnd.api+json
      responses:
        "200":
          description: What was deleted
          schema:
            $ref: '#/definitions/jsonapi.EmptyTrashResponse'
        "403":
          description: Admin role required
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Empty Trash
      tags:
      - trash
  /g/{groupSlug}/trash/commodities:
    get:
      description: |-
        Items deleted in this group, most recently deleted first, with
        who deleted them, when they expire and the files that went
        with them.
      parameters:
      - description: Group slug
        in: path
        name: groupSlug
        required: true
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: per_page
        type: integer
      produces:
      - application/vnd.api+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/jsonapi.TrashedCommoditiesResponse'
      summary: List items in Trash
      tags:
      - trash
  /g/{groupSlug}/trash/commodities/{commodityID}:
    delete:
      description: |-
        Deletes the item, its history and the files that went to Trash
        with it. A file another item or place still uses is kept.
        Requires the admin or owner role.
      parameters:
      - description: Group slug
        in: path
        name: groupSlug
        required: true
        type: string
      - description: Commodity ID
        in: path
        name: commodityID
        required: true
        type: string
      responses:
        "204":
          description: No content
        "403":
          description: Admin role required
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "404":
          description: Item not in Trash
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Delete an item in Trash for good
      tags:
      - trash
  /g/{groupSlug}/trash/commodities/{commodityID}/restore:
    post:
      description: |-
        Brings the item back with its history, loans, service records,
        maintenance schedules and the files that went to Trash with
        it. An item whose area was deleted meanwhile comes back
        without an area (meta.area_removed).
      parameters:
      - description: Group slug
        in: path
        name: groupSlug
        required: true
        type: string
      - description: Commodity ID
        in: path
        name: commodityID
        required: true
        type: string
      produces:
      - application/vnd.api+json
      responses:
        "200":
          description: Restored item
          schema:
            $ref: '#/definitions/jsonapi.CommodityRestoreResponse'
        "404":
          description: Item not in Trash
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Restore an item from Trash
      tags:
      - trash
  /g/{groupSlug}/trash/commodities/purge:
    post:
      consumes:
      - application/vnd.api+json
      description: Requires the admin or owner role.
      parameters:
      - description: Group slug
        in: path
        name: groupSlug
        required: true
        type: string
      - description: Item IDs
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/jsonapi.BulkIDsRequest'
      produces:
      - application/vnd.api+json
      responses:
        "200":
          description: Per-id outcome
          schema:
            $ref: '#/definitions/jsonapi.BulkResultResponse'
        "403":
          description: Admin role required
          schema:
            $ref: '#/definitions/jsonapi.Errors'
        "422":
          description: Bad request body
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Delete items in Trash for good
      tags:
      - trash
  /g/{groupSlug}/trash/commodities/restore:
    post:
      consumes:
      - application/vnd.api+json
      description: |-
        Restores every item whose id appears in the body. The response
        lists the restored ids, the failures, and the restored items
        that came back without an area. A failure's code is not_found
        when the item is not in Trash (restored already, never deleted,
        or not in the group), and failed for any other error.
      parameters:
      - description: Group slug
        in: path
        name: groupSlug
        required: true
        type: string
      - description: Item IDs
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/jsonapi.BulkIDsRequest'
      produces:
      - application/vnd.api+json
      responses:
        "200":
          description: Per-id outcome
          schema:
            $ref: '#/definitions/jsonapi.TrashBulkRestoreResponse'
        "422":
          description: Bad request body
          schema:
            $ref: '#/definitions/jsonapi.Errors'
      summary: Restore items from Trash
      tags:
      - trash
  /g/{groupSlug}/trash/files:
    get:
      description: |-
        Files deleted on their own in this group, most recently
        deleted first. Files that went to Trash with an item are
        listed with that item instead.
      parameters:
      - description: Group slug
        in: path
        name: groupSlug
        required: true
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: per_page
        type: integer
      produces:
      - application/vnd.api+json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/jsonapi.TrashedFilesResponse'
      summary: List files in Trash
      tags:
      - trash
  /g/{groupSlug}/trash/files/{fileID}:
    delete:
      description: |-
        Requires the admin or owner role. A file that went to Trash
