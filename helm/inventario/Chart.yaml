apiVersion: v2
name: inventario
description: Personal inventory management system
type: application
version: 0.6.0
# Pinned to a published release, not "latest": it is the default for
# image.tag, so a floating value makes a stock install unreproducible and,
# before any release existed, unpullable (#2035). Bump it with the release —
# .github/workflows/release.yml fails a tag whose chart disagrees.
# The "v" is part of it: docker.yml tags images vX.Y.Z, and appVersion is the
# default for image.tag, so a bare 0.1.0 resolves to a tag that was never
# published.
appVersion: "v0.1.0"
keywords:
  - inventory
  - personal
  - self-hosted
home: https://github.com/denisvmedia/inventario
sources:
  - https://github.com/denisvmedia/inventario
maintainers:
  - name: denisvmedia
    url: https://github.com/denisvmedia
