{{- if eq (include "inventario.apiserverRendered" .) "true" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "inventario.fullname" . }}
  labels:
    {{- include "inventario.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "inventario.apiserverServiceSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 3333
      protocol: TCP
    # In-cluster only: /metrics is served here so the ingress, whose default
    # rule is path `/` on the http port, cannot reach it (#2244).
    - name: probe
      port: 3334
      targetPort: probe
      protocol: TCP
{{- end }}
