{{- /*
Separate init-data Job, rendered whenever schema migrations run in the app
pod (#1884, #2086). It creates the default tenant / admin user (idempotent)
and optionally seeds demo data via a temporary `inventario run` server.

It has to be separate because it must run AFTER the schema is migrated, and
in this mode the migration happens in the Deployment's `migrate` init
container rather than before the Deployment exists. Under ArgoCD that is
sync-wave +5, which waits for the Deployment to be Healthy. Under plain Helm
it is a post-install/post-upgrade hook, which is weaker: without
`helm upgrade --wait` Helm runs those hooks as soon as the manifests are
applied, so this Job can start while the new pods are still migrating. The
dbRetry loop below is what covers that window — `inventario db migrate data`
fails and is retried until the schema is there.

When migrations stay in the setup Job (the chart default), everything runs
there instead and this template renders nothing.
*/}}
{{- if and .Values.setupJob.enabled (eq (include "inventario.migrateInPod" .) "true") }}
{{- $fullName := include "inventario.fullname" . -}}
{{- $secretName := include "inventario.secretName" . -}}
{{- $imageTag := default .Chart.AppVersion .Values.image.tag -}}
{{- $redisUrl := include "inventario.redisUrl" . -}}
{{- $usePersistentUploads := and .Values.persistence.enabled (hasPrefix "file://" (include "inventario.uploadLocation" .)) -}}
{{- $jobName := printf "%s-init-data" $fullName | trunc 63 | trimSuffix "-" -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $jobName }}
  labels:
    {{- include "inventario.labels" . | nindent 4 }}
    app.kubernetes.io/component: init-data
  annotations:
    {{- if .Values.setupJob.argocdMode }}
    # ArgoCD post-Deployment Job (#1884). Runs after the app Deployment is
    # Healthy (which only happens once its `migrate` init container brings
    # the schema up to date). This Job then calls `inventario db migrate
    # data` to ensure the default tenant / admin row exists, and on a fresh
    # install also seeds demo data via a temporary in-Job `inventario run`
    # server. Idempotent — admin/tenant rows are created with IF NOT
    # EXISTS semantics and the seed step honors SETUP_SKIP_SEED_ON_UPGRADE.
    # Replace=true delete-then-creates the immutable Job on each sync.
    "argocd.argoproj.io/sync-wave": "5"
    "argocd.argoproj.io/sync-options": "Force=true,Replace=true"
    {{- else }}
    # Plain Helm: a post-phase hook, so it runs after the Deployment
    # manifests are applied rather than before them. Jobs are immutable, so
    # before-hook-creation deletes the previous one; hook-failed keeps a
    # failed Job around for its logs.
    "helm.sh/hook": "post-install,post-upgrade"
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-failed
    {{- end }}
spec:
  backoffLimit: 3
  {{- with .Values.setupJob.initData.activeDeadlineSeconds }}
  # Cap the Job's wall-clock so an unpullable image fails the Job (and the
  # sync op) instead of hanging it indefinitely. See values.yaml
  # setupJob.initData.activeDeadlineSeconds.
  activeDeadlineSeconds: {{ . }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "inventario.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: init-data
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "inventario.serviceAccountName" . }}
      restartPolicy: OnFailure
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: init-data
          image: {{ printf "%s:%s" .Values.image.repository $imageTag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              {{- include "inventario.initDataScript" . | nindent 14 | replace "\n              \n" "\n\n" }}
          envFrom:
            - configMapRef:
                name: {{ $fullName }}-config
            - secretRef:
                name: {{ $secretName }}
          env:
            # The seed step boots a throwaway `inventario run` server, which
            # initializes the AI-vision provider. Seeding never uses it, and this
            # Job does NOT carry the provider's API key (the reflected
            # inventario-ai-vision Secret is wired via extraEnvFrom on the
            # Deployments only). Inheriting provider=anthropic from the ConfigMap
            # would therefore fail the temporary server's boot (wireCommodityScan
            # is fail-loud on an empty key) and the seed would never run. Force
            # the provider off here — an explicit `env` entry overrides the same
            # key coming from the ConfigMap via envFrom. (#1976)
            - name: INVENTARIO_RUN_AI_VISION_PROVIDER
              value: "none"
            - name: APP_DB_DSN
              {{- if .Values.demo.postgresql.enabled }}
              value: {{ include "inventario.dbDsn" . | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: INVENTARIO_DB_DSN
              {{- end }}
            - name: MIGRATOR_DB_DSN
              {{- if .Values.demo.postgresql.enabled }}
              value: {{ include "inventario.migratorDsn" . | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: MIGRATOR_DB_DSN
                  optional: true
              {{- end }}
            - name: INVENTARIO_MIGRATE_DATA_DEFAULT_TENANT_NAME
              value: {{ .Values.setupJob.initData.defaultTenantName | quote }}
            - name: INVENTARIO_MIGRATE_DATA_DEFAULT_TENANT_SLUG
              value: {{ .Values.setupJob.initData.defaultTenantSlug | quote }}
            - name: INVENTARIO_MIGRATE_DATA_ADMIN_EMAIL
              value: {{ .Values.setupJob.initData.adminEmail | quote }}
            - name: INVENTARIO_MIGRATE_DATA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: SETUP_ADMIN_PASSWORD
            - name: INVENTARIO_MIGRATE_DATA_ADMIN_NAME
              value: {{ .Values.setupJob.initData.adminName | quote }}
            # Back-office (platform-operator) auto-provisioning (#1967). The
            # shell step above only runs when BACKOFFICE_USER_ENABLED=true.
            # Demo/preview overlays flip backofficeUser.enabled on; production
            # leaves it false and provisions operators manually.
            - name: BACKOFFICE_USER_ENABLED
              value: {{ ternary "true" "false" .Values.backofficeUser.enabled | quote }}
            {{- if .Values.backofficeUser.enabled }}
            - name: INVENTARIO_BACKOFFICE_BOOTSTRAP_EMAIL
              value: {{ .Values.backofficeUser.email | quote }}
            # Optional sops-sourced override of the operator email. apply-secrets.sh
            # materializes BACKOFFICE_USER_EMAIL into the existing Secret from the
            # bundle's backoffice.email on master/longevity; the shell step above
            # prefers it over INVENTARIO_BACKOFFICE_BOOTSTRAP_EMAIL. optional:true so
            # PR previews (no such key) transparently fall back to the value. (#1967)
            - name: BACKOFFICE_USER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: BACKOFFICE_USER_EMAIL
                  optional: true
            - name: INVENTARIO_BACKOFFICE_BOOTSTRAP_NAME
              value: {{ .Values.backofficeUser.name | quote }}
            - name: INVENTARIO_BACKOFFICE_BOOTSTRAP_ROLE
              value: {{ .Values.backofficeUser.role | quote }}
            - name: INVENTARIO_BACKOFFICE_BOOTSTRAP_MFA_ENFORCED
              value: {{ ternary "true" "false" .Values.backofficeUser.mfaEnforced | quote }}
            - name: INVENTARIO_BACKOFFICE_BOOTSTRAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: BACKOFFICE_USER_PASSWORD
                  optional: true
            {{- end }}
            - name: SEED_DATABASE
              value: {{ ternary "true" "false" .Values.setupJob.initData.seedDatabase | quote }}
            # SETUP_SKIP_SEED_ON_UPGRADE. Under plain Helm this follows
            # .Release.IsUpgrade, the same as the setup Job: an upgrade must
            # not re-seed demo data over what the user has since entered.
            # ArgoCD does not expose Helm's upgrade flag, and the Job is
            # delete-then-created on every sync under Replace=true regardless,
            # so there it is gated by `seedDatabase` alone — leave that false
            # in production overlays. (The seed is also one-shot server-side:
            # /api/v1/seed only accepts the first install.)
            - name: SETUP_SKIP_SEED_ON_UPGRADE
              {{- if .Values.setupJob.argocdMode }}
              value: "false"
              {{- else }}
              value: {{ ternary "true" "false" .Release.IsUpgrade | quote }}
              {{- end }}
            # Opt the seed into writing the bundled fixture bytes (cover
            # photos / invoices / manuals) for whatever tenant we seed —
            # not just the well-known `test-org`. Set only here on the
            # Job's temporary seed server, never on the main Deployment,
            # so the public /api/v1/seed surface stays cost-bounded.
            - name: INVENTARIO_SEED_ALLOW_BLOB_UPLOADS
              value: {{ ternary "true" "false" .Values.setupJob.initData.seedBlobUploads | quote }}
            - name: INVENTARIO_SEED_DB_DSN
              {{- if .Values.demo.postgresql.enabled }}
              value: {{ include "inventario.dbDsn" . | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: INVENTARIO_DB_DSN
              {{- end }}
            # Point the temporary seed server at the SAME bucket the app
            # reads from (MinIO s3:// when demo.minio.enabled, the file://
            # uploads PVC otherwise). Hardcoding file:///app/uploads here
            # would strand seed blobs in the Job pod's emptyDir under the
            # MinIO demo, where the app can never read them.
            - name: INVENTARIO_RUN_UPLOAD_LOCATION
              value: {{ include "inventario.uploadLocation" . | quote }}
            # Mount the public /api/v1/seed route ONLY on this throwaway
            # in-Job seed server so the shell step can curl it (#2039). Seed
            # runs a privileged, RLS-bypassing operation, so the route is off
            # by default everywhere else; it is set here and NEVER on the main
            # app Deployment / ConfigMap, keeping production unable to seed.
            - name: INVENTARIO_RUN_ENABLE_SEED_ENDPOINT
              value: "true"
            {{- if .Values.demo.redis.enabled }}
            - name: INVENTARIO_RUN_TOKEN_BLACKLIST_REDIS_URL
              value: {{ $redisUrl | quote }}
            - name: INVENTARIO_RUN_AUTH_RATE_LIMIT_REDIS_URL
              value: {{ $redisUrl | quote }}
            - name: INVENTARIO_RUN_GLOBAL_RATE_LIMIT_REDIS_URL
              value: {{ $redisUrl | quote }}
            - name: INVENTARIO_RUN_CSRF_REDIS_URL
              value: {{ $redisUrl | quote }}
            - name: INVENTARIO_RUN_EMAIL_QUEUE_REDIS_URL
              value: {{ $redisUrl | quote }}
            {{- end }}
            {{- if .Values.demo.minio.enabled }}
            - name: AWS_ACCESS_KEY_ID
              value: {{ .Values.demo.minio.rootUser | quote }}
            - name: AWS_SECRET_ACCESS_KEY
              value: {{ .Values.demo.minio.rootPassword | quote }}
            {{- end }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: tmp
              mountPath: /tmp
      containers:
        - name: complete
          image: "busybox:1.36"
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "echo \"Init-data complete\" && exit 0"]
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: uploads
          {{- if $usePersistentUploads }}
          persistentVolumeClaim:
            claimName: {{ $fullName }}-uploads
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
{{- end }}
