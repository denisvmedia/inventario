{{- /*
Prometheus Operator alert + recording rules (#2034).

The same three alerts the dev compose stack evaluates, but expressed for a
cluster: `up` is filtered by namespace and by the operator's own `service` /
`pod` labels rather than the compose stack's static `job="inventario"`, which
does not exist under the operator.

The two files are kept from drifting apart by a helm-lint step that compares
the alert NAMES rendered here against deploy/monitoring/prometheus/rules/ —
the selectors legitimately differ, the alert set must not.

Double-gated like the ServiceMonitor: the toggle AND the CRD, so enabling it
on a cluster without the operator is a no-op rather than a render error.
*/ -}}
{{- if and .Values.metrics.prometheusRule.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
{{- $fullname := include "inventario.fullname" . -}}
{{- /* Targets this release owns, whichever monitor discovered them. A
       ServiceMonitor stamps `service`; a PodMonitor stamps `pod`, whose names
       all start with the release fullname. */ -}}
{{- $targets := printf `namespace="%s", service=~"%s.*"` .Release.Namespace $fullname -}}
{{- $podTargets := printf `namespace="%s", pod=~"%s.*"` .Release.Namespace $fullname -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "inventario.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: inventario-recording
      interval: {{ .Values.metrics.prometheusRule.interval }}
      rules:
        # Server-error ratio over 5m, per matched route.
        - record: inventario:http_5xx_ratio:rate5m
          expr: |
            sum by (route) (rate(inventario_http_requests_total{status_class="5xx"}[5m]))
            /
            clamp_min(sum by (route) (rate(inventario_http_requests_total[5m])), 1e-9)

        # Global p95 request latency over 5m.
        - record: inventario:http_request_p95_seconds:5m
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (rate(inventario_http_request_duration_seconds_bucket[5m]))
            )

    - name: inventario-alerts
      rules:
        # A target Prometheus knows about but cannot reach. Covers both the
        # apiserver Service endpoints and, when the PodMonitor is on, each
        # worker pod — a worker that stops being scraped is invisible
        # otherwise, because its queue gauges simply stop updating rather
        # than going to zero.
        - alert: InventarioTargetDown
          expr: up{ {{- $targets -}} } == 0 or up{ {{- $podTargets -}} } == 0
          for: {{ .Values.metrics.prometheusRule.targetDownFor }}
          labels:
            severity: critical
          annotations:
            summary: "Inventario /metrics target is down"
            description: "Prometheus cannot scrape {{ `{{ $labels.instance }}` }} in namespace {{ .Release.Namespace }}."

        - alert: InventarioHighErrorRate
          expr: |
            sum(rate(inventario_http_requests_total{status_class="5xx"}[5m]))
            /
            clamp_min(sum(rate(inventario_http_requests_total[5m])), 1e-9)
            > {{ .Values.metrics.prometheusRule.errorRatioThreshold }}
          for: {{ .Values.metrics.prometheusRule.errorRateFor }}
          labels:
            severity: warning
          annotations:
            summary: "Inventario 5xx ratio above threshold"
            description: "Global server-error ratio is {{ `{{ $value | humanizePercentage }}` }} over the last 5m."

        - alert: InventarioHighLatencyP95
          expr: inventario:http_request_p95_seconds:5m > {{ .Values.metrics.prometheusRule.latencyP95Seconds }}
          for: {{ .Values.metrics.prometheusRule.latencyFor }}
          labels:
            severity: warning
          annotations:
            summary: "Inventario p95 latency above threshold"
            description: "Global p95 request latency is {{ `{{ $value }}` }}s over the last 5m."
{{- end }}
