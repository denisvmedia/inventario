<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inventario API reference</title>
    <link rel="icon" href="../favicon.svg" />
    <style>
      body {
        margin: 0;
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
    </style>
  </head>
  <body>
    <!-- Both files are placed here by scripts/build-api-reference.mjs: the
         spec is copied from go/docs/swagger.yaml, the bundle from
         node_modules. Neither is committed.
         Redoc 3 ships its standalone bundle as an ES module, so the script
         needs type="module". Its usage telemetry is on by default; this page
         keeps Redoc 2's behavior and sends nothing. -->
    <redoc
      spec-url="./swagger.yaml"
      hide-download-buttons="false"
      disable-telemetry="true"
    ></redoc>
    <script type="module" src="./redoc.standalone.js"></script>
  </body>
</html>
