version: 2

project_name: inventario

before:
  hooks:
    # Build the frontend bundle so the Go binary embeds it.
    - make build-frontend

builds:
  - binary: inventario
    main: ./cmd/inventario
    dir: go
    flags:
      # Use build tags to include frontend assets
      - -tags=with_frontend
      - -trimpath
    ldflags:
      - -s -w
      - -X go.5x5.cz/inventario/internal/version.Version={{.Version}}
      - -X go.5x5.cz/inventario/internal/version.Commit={{.Commit}}
      - -X go.5x5.cz/inventario/internal/version.Date={{.Date}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats: [ 'tar.gz' ]
    wrap_in_directory: true
    format_overrides:
      - goos: windows
        formats: [ 'zip' ]
    name_template: '{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}'
    files:
      - LICENSE
      - README.md

# Docker images are built by .github/workflows/docker.yml (matrix build on
# native amd64/arm64 runners + buildx imagetools merge). Goreleaser keeps
# responsibility for binaries, archives, checksums and the GitHub Release.

snapshot:
  version_template: SNAPSHOT-{{ .Commit }}

checksum:
  disable: false
  name_template: '{{ .ProjectName }}-{{ .Version }}-checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      # Conventional-commit scopes are optional, and most of this repo's
      # commits carry one (`build(deps):`, `docs(k8s):`), so an anchored
      # `^build:` matches almost nothing. The alternation covers the bare
      # form, a scope, and the breaking-change `!`.
      - '^(build|chore|ci|docs|test|style|refactor)(\([^)]*\))?!?:'
      - Merge pull request
      - Merge branch
      - go mod tidy

release:
  skip_upload: false
  github:
    owner: denisvmedia
    name: inventario
  header: |
    ## Inventario v{{ .Version }}
    
    This release includes the following changes:
  footer: |
    
    ## Installation
    
    ### Pre-built binaries
    
    Download the archive for your platform from the assets below and verify it
    against `inventario-{{ .Version }}-checksums.txt`.
    
    ### Container image
    
    ```bash
    docker pull ghcr.io/denisvmedia/inventario:v{{ .Version }}
    ```
    
    ### Kubernetes
    
    See [PRODUCTION.md](https://github.com/denisvmedia/inventario/blob/v{{ .Version }}/PRODUCTION.md)
    for the Helm chart and a worked `values-prod.yaml`.

source:
  enabled: true
  name_template: '{{ .ProjectName }}-{{ .Version }}-source'
