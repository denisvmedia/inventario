apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-bucket
  namespace: inventario-dev
  labels:
    app.kubernetes.io/name: minio-create-bucket
    app.kubernetes.io/component: data-service
    app.kubernetes.io/part-of: inventario
    app.kubernetes.io/managed-by: raw-yaml
    inventario.io/environment: dev
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-create-bucket
        app.kubernetes.io/component: data-service
        app.kubernetes.io/part-of: inventario
        app.kubernetes.io/managed-by: raw-yaml
        inventario.io/environment: dev
    spec:
      restartPolicy: OnFailure
      containers:
        # The AWS CLI rather than a server-specific client: creating a bucket
        # is plain S3, so this step does not have to be replaced again the
        # next time the object store behind the `minio` service changes.
        - name: create-bucket
          image: amazon/aws-cli:2.32.7
          imagePullPolicy: IfNotPresent
          env:
            # SeaweedFS runs without authentication in this stack, so the
            # values are only here because the SDK refuses to sign without
            # them. The secret still carries the pair the app uses.
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_USER
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_PASSWORD
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          envFrom:
            - secretRef:
                name: minio-credentials
          command:
            - /bin/sh
            - -c
            - |
              set -e
              until aws --endpoint-url http://minio:9000 s3api list-buckets >/dev/null 2>&1; do
                echo "Waiting for the object store to become ready..."
                sleep 2
              done
              # create-bucket is not idempotent: an existing bucket is a
              # BucketAlreadyOwnedByYou error, which is the outcome we want.
              aws --endpoint-url http://minio:9000 s3api create-bucket \
                --bucket "$MINIO_BUCKET_NAME" \
                || aws --endpoint-url http://minio:9000 s3api head-bucket --bucket "$MINIO_BUCKET_NAME"
