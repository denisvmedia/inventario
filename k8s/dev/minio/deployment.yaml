apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: inventario-dev
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: data-service
    app.kubernetes.io/part-of: inventario
    app.kubernetes.io/managed-by: raw-yaml
    inventario.io/environment: dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
      inventario.io/environment: dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/component: data-service
        app.kubernetes.io/part-of: inventario
        app.kubernetes.io/managed-by: raw-yaml
        inventario.io/environment: dev
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        # SeaweedFS, not MinIO. MinIO withdrew anonymous pulls of its images:
        # quay.io answers 401 for every tag including the ones pinned here
        # before, docker.io/minio was withdrawn earlier still, and ghcr.io has
        # no public mirror. The dev stack needs an S3 endpoint, not MinIO
        # specifically, and this one is pullable without credentials.
        #
        # The resource keeps the name `minio` because the service hostname is
        # baked into the app's UPLOAD_LOCATION and into the workflows and
        # scripts that wait on it. Renaming is worth doing on its own, not
        # inside the change that unbreaks the pull.
        - name: minio
          image: chrislusf/seaweedfs:3.97
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
          args:
            - server
            - -dir=/data
            - -s3
            - -s3.port=9000
            - -ip.bind=0.0.0.0
          ports:
            - name: api
              containerPort: 9000
          readinessProbe:
            httpGet:
              # The S3 gateway answers 200 on / once it is listening.
              # SeaweedFS has no dedicated readiness path on this port.
              path: /
              port: api
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          volumeMounts:
            - name: minio-data
              mountPath: /data
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-data
