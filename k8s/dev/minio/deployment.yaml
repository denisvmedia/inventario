apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: inventario-dev
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: data-service
    app.kubernetes.io/part-of: inventario
    app.kubernetes.io/managed-by: raw-yaml
    inventario.io/environment: dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
      inventario.io/environment: dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/component: data-service
        app.kubernetes.io/part-of: inventario
        app.kubernetes.io/managed-by: raw-yaml
        inventario.io/environment: dev
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        # Silo, a maintained fork of the MinIO server. MinIO withdrew anonymous
        # pulls of its own images — quay.io answers 401 for every tag and
        # docker.io/minio went earlier still — which is what broke this stack.
        # The fork keeps the S3 API, the MINIO_* variables, the /minio/* routes
        # and the on-disk format, so everything below is unchanged.
        #
        # Pinned rather than :latest, because a floating tag is how the pull
        # broke without a commit.
        - name: minio
          image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
          args:
            - server
            - /data
            - --console-address
            - :9001
          envFrom:
            - secretRef:
                name: minio-credentials
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          volumeMounts:
            - name: minio-data
              mountPath: /data
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-data
