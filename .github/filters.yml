# Path filters for conditional CI execution on pull requests.
#
# Each top-level key is a filter consumed by a `dorny/paths-filter@v3` step
# in one or more workflow files. Pattern semantics are picomatch — `**` for
# any depth, repo-relative paths. **Negation (`!`) patterns are intentionally
# avoided**: `dorny/paths-filter`'s default `predicate-quantifier: 'some'`
# makes a single `!` match every non-matching file, which would silently
# evaluate every filter to `true` and defeat the whole optimization.
#
# Pull requests skip jobs whose ecosystem filter is `false`. Pushes to
# `master` and pushes of `v*` tags always run the full pipeline (the
# workflow `if:` clauses include `github.event_name != 'pull_request'`).
#
# Any change inside `.github/workflows/` or `.github/actions/`, or to
# `mise.toml` or this file sets `ci=true`, which every workflow ORs into its
# gate — when CI itself is being edited we run everything (false-positive
# cost is preferred over a silently-skipped check).
#
# A doc-only change inside one of these subtrees (e.g. `go/README.md`) will
# match the ecosystem filter and trigger that ecosystem's checks. The
# false-positive cost (one extra run of cheap tests on a rare path) is
# preferred over the maintenance and fragility of correctly-composed
# negation patterns.
#
# Full design and decision tables: devdocs/ci/conditional-execution.md.

# ---- Backend (Go) ---------------------------------------------------------
# Go sources, root-level cmd helpers, linter config, build glue, release
# config. Everything under go/ is included — including `go/docs/**` (the
# generated swagger output) because regenerating docs is what the swagger
# drift workflow tests, and we want it gated on the same surface.
go:
  - 'go/**'
  - 'cmd/**'
  - '.golangci.yml'
  - 'Makefile'
  - '.goreleaser.yaml'

# ---- Swagger / OpenAPI surface -------------------------------------------
# `swag init` walks every package transitively imported by the annotated
# handlers — so a change to `go/services/foo.go` that flips a response
# type can shift `swagger.json` even though no handler file moved. To
# avoid the drift check silently skipping that case, this filter mirrors
# the full Go surface.
go_swagger:
  - 'go/**'
  - 'Makefile'

# ---- Derived schema artifact ---------------------------------------------
# go/schema/schema.hcl is rendered from the //ptah:schema:* annotations, which
# live only under go/models/. The generator script and the Makefile target are
# in here too, so a change to how it is produced re-checks the output.
go_schema_artifact:
  - 'go/models/**'
  - 'go/schema/schema.hcl'
  - 'go/go.mod'
  - 'scripts/generate-schema-hcl.sh'
  - 'Makefile'

# ---- Schema change plan --------------------------------------------------
# What decides the schema Ptah plans, and what the plan is compared against:
# the model annotations that declare the desired schema, the migration chain a
# base-state database is brought up to, the pinned Ptah version, and the
# extension ignore list the comparison reads.
go_schema_plan:
  - 'go/models/**'
  - 'go/schema/**'
  - 'go/go.mod'
  - 'ptah.yaml'

# ---- Frontend (React) ----------------------------------------------------
# Anything under frontend/. Includes the Makefile because it carries
# frontend targets too.
#
# CHANGELOG.md is not here, although the build reads it for the What's new
# page (#1386). Nearly every pull request adds an entry to it, so listing it
# would run the whole frontend suite, and through `image_inputs` the image
# build and e2e, on every docs or backend change. An Unreleased entry never
# reaches the bundle anyway. What a change to the file can break is the
# parse, and the `changelog` filter below runs that check on its own.
frontend:
  - 'frontend/**'
  - 'Makefile'

# ---- Release notes -------------------------------------------------------
# CHANGELOG.md alone. Frontend Test runs the CHANGELOG.md guard in
# frontend/src/lib/__tests__/changelog.test.ts when this is the only
# frontend input that changed, so a changelog-only pull request (a release,
# a fixup of entries) is still checked against what the page can read.
changelog:
  - 'CHANGELOG.md'

# ---- Frontend codegen drift ----------------------------------------------
# OpenAPI -> TypeScript regeneration is driven by frontend/scripts/codegen.mjs
# and consumes go/docs/swagger.json (regenerated from the Go surface).
# Trigger the drift check when either the generator or any Go file changes.
frontend_codegen:
  - 'frontend/scripts/codegen.mjs'
  - 'frontend/package*.json'
  - 'frontend/src/types/api.d.ts'
  - 'go/**'
  - 'Makefile'

# ---- Frontend i18n drift -------------------------------------------------
# Keys extracted from src/ vs. committed locale catalogs.
frontend_i18n:
  - 'frontend/src/**'
  - 'frontend/i18next.config.ts'
  - 'frontend/scripts/i18n-check.mjs'
  - 'frontend/package*.json'

# ---- E2E suite -----------------------------------------------------------
# Test code and its compose override. The e2e workflow itself ORs `e2e`
# into its browser-matrix decision so an e2e-only PR runs the full matrix
# (test changes can themselves cross browser boundaries).
e2e:
  - 'e2e/**'
  - 'docker-compose.e2e.yaml'

# ---- Docker image inputs -------------------------------------------------
# Everything that requires a fresh production image to be built. Includes:
#   - the obvious image-defining files (Dockerfile, compose, go/, frontend/,
#     scripts/, init-scripts/, Makefile, .goreleaser.yaml)
#   - not CHANGELOG.md, which the Dockerfile copies into the frontend stage
#     for the What's new page: see the `frontend` filter for why. Pushes to
#     master and tags build the image whatever changed, so a published image
#     always carries the current file.
#   - `e2e/**` and `docker-compose.e2e.yaml` because the e2e lanes in
#     docker.yml test the image of this commit and run only when it is
#     built. Without them an e2e-only PR would report green without running
#     a single test.
#   - `k8s/dev/**` for the same reason: the kind smoke test in docker.yml
#     runs only against an image built for the commit.
image_inputs:
  - 'Dockerfile'
  - '.dockerignore'
  - 'docker-compose*.yaml'
  - 'go/**'
  - 'frontend/**'
  - 'scripts/**'
  - 'init-scripts/**'
  - 'Makefile'
  - '.goreleaser.yaml'
  - 'e2e/**'
  - 'k8s/dev/**'
  # Helm chart, ArgoCD manifests, and preview overlays. The Docker image
  # itself doesn't depend on these, but PR-preview Applications (#1858) pull
  # `ghcr.io/.../inventario:sha-<7>` — which only exists if docker.yml ran
  # for the PR's head commit. A PR that touches only these paths would
  # otherwise silently skip the build and ApplicationSet pods crash with
  # ImagePullBackOff. Including these here triggers a docker.yml run that
  # cache-hits on every layer (no Dockerfile/source change) and just re-tags
  # pr-N + sha-<7> onto the existing manifest list — ~3 min vs ~15 min cold.
  #
  # Coverage rationale: helm/** covers chart changes, infra/helm-overlays/**
  # covers values overlay changes, infra/argocd/** covers ApplicationSet /
  # AppProject / master Application changes (all of which alter what the
  # preview deploys). infra/vm/** is intentionally NOT included — VM
  # bootstrap scripts affect the cluster provisioning step, not the deployed
  # workload, and the master cluster runs them on-demand from the laptop.
  - 'helm/**'
  - 'infra/helm-overlays/**'
  - 'infra/argocd/**'

# ---- Helm chart and the monitoring stack it renders ----------------------
# helm-lint does more than lint the chart: it renders the alert rules and runs
# promtool and amtool over them, and checks the preview AppProjects against
# the chart rendered with the preview values, so the inputs live outside helm/
# too.
helm:
  - 'helm/**'
  - 'deploy/monitoring/**'
  - 'scripts/test-alert-rules.sh'
  - 'scripts/test-alert-routing.sh'
  - 'infra/argocd/**'
  - 'infra/helm-overlays/**'
  - 'infra/vm/cluster-extras/preview-namespace-limits.yaml'
  - 'infra/vm/cluster-extras/preview-namespace-pod-security.yaml'
  - '.github/scripts/preview-manifests.py'

# ---- Renovate configuration ----------------------------------------------
# The only input renovate-config-validator reads.
renovate_config:
  - 'renovate.json'

# ---- Markdown lint -------------------------------------------------------
# Any markdown file anywhere in the repo, plus the linter's own config.
# Used by `markdown-lint.yml` to skip the run when no documentation
# changed. Note: this filter doesn't include `ci` paths — the workflow
# OR-s `needs.changes.outputs.ci` into its own gate the usual way, so
# CI-self changes still re-run markdownlint without bloating this filter.
markdown:
  - '**/*.md'
  - '.markdownlint.jsonc'
  - '.markdownlint-cli2.jsonc'

# ---- CI self-reference ---------------------------------------------------
# Any change to a workflow file, a composite action, the shared tool pins,
# or this filter file forces the full pipeline back on. Conservative on
# purpose — when CI is being edited we want every check to confirm the edit
# didn't break it.
ci:
  - '.github/workflows/**'
  - '.github/actions/**'
  - '.github/filters.yml'
  - 'mise.toml'
