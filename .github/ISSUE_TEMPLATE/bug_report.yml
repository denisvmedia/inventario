name: Bug report
description: Something works differently than it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file this. Most first-run failures turn
        out to be configuration, and the server log usually names the setting —
        so the log is the single most useful thing you can attach.

        **Do not report a security vulnerability here.** Use the private
        channels in [SECURITY.md](https://github.com/denisvmedia/inventario/blob/master/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The shortest sequence that shows the problem.
      placeholder: |
        1. Sign in as …
        2. Open …
        3. …
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How is it installed
      description: The two paths behave differently; knowing which one you are on usually halves the diagnosis.
      options:
        - Docker Compose
        - Kubernetes (Helm chart)
        - Built from source / go run
        - Something else
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `inventario version`, or the image tag you are running.
      placeholder: v0.1.0
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Server log
      description: >
        The lines around the failure. Redact anything sensitive — a DSN
        carries a password, and an access token is a live credential.
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Browser and version for a UI problem, database and version for a data one, or anything that seems relevant.
