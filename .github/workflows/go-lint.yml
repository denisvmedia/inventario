name: Go Lint

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: .github/filters.yml

  golangci:
    name: lint
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.go == 'true' ||
      needs.changes.outputs.ci == 'true'
    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - id: vars
        uses: ./.github/actions/vars

      # An empty `version:` makes golangci-lint-action install `latest`, which
      # is how this went unnoticed for so long — the lane stays green while
      # linting with a binary nobody chose. Fail instead (#1818).
      - name: Check the golangci-lint pin resolved
        env:
          VERSION: ${{ steps.vars.outputs.golangci_lint_version }}
        run: |
          set -euo pipefail
          if [ -z "$VERSION" ]; then
            echo "::error::the vars action exposed no golangci_lint_version; golangci-lint would silently fall back to latest"
            exit 1
          fi
          echo "golangci-lint pinned to $VERSION"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.27.1
          cache: true
          cache-dependency-path: go/go.sum

      - name: nolintguard
        run: |
          echo "Running nolintguard..."
          cd go && go tool nolintguard ./...

      - name: qtlint
        run: |
          echo "Running qtlint..."
          cd go && go tool qtlint ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          args: --timeout=30m
          # Pinned, not `latest`: a new release flags pre-existing findings
          # the moment it lands, and CI goes red for a diff that did not
          # cause it. The pin lives in .github/actions/vars so this workflow
          # and copilot-setup-steps.yml install the same binary (#1818).
          version: ${{ steps.vars.outputs.golangci_lint_version }}
          working-directory: go
