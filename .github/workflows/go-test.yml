name: Go Test

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Resolve which ecosystems this PR touches. See .github/filters.yml +
  # devdocs/ci/conditional-execution.md. On push events the test job
  # gates short-circuit and the filter result is unused.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: .github/filters.yml

  test:
    name: test
    runs-on: ubuntu-latest
    needs: changes
    # PR: only run when go-relevant paths changed (or any .github/** change
    # forces the conservative fallback). Push to master / tag push always
    # runs.
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.go == 'true' ||
      needs.changes.outputs.ci == 'true'
    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - id: vars
        uses: ./.github/actions/vars

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.26.6
          cache: true
          cache-dependency-path: go/go.sum

      - name: Install dependencies
        run: go mod download
        working-directory: go

      - name: Run tests
        # tee keeps the per-package "coverage: N%" lines for the summary step;
        # pipefail keeps the pipeline's exit status the one that matters.
        run: |
          set -euo pipefail
          go test -v -race -covermode=atomic -coverprofile=coverage-unit.out ./... 2>&1 \
            | tee test-output.txt
        working-directory: go

      - name: Coverage summary
        # Runs on failure too: a red suite is when "which package is untested"
        # is most worth seeing.
        if: always()
        run: ../.github/scripts/coverage-summary.sh test-output.txt coverage-unit.out "unit tests"
        working-directory: go

      - name: Upload the coverage profile
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: go-coverage-unit
          path: go/coverage-unit.out
          if-no-files-found: warn
          retention-days: 14
