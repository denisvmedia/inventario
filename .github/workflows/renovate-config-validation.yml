name: Renovate Config Validation

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Resolve which ecosystems this PR touches. See .github/filters.yml +
  # devdocs/ci/conditional-execution.md. A workflow-level `paths:` filter
  # creates no check run at all on the pull requests it skips, which is what
  # keeps a context from being required (#1816, #2569); the gate below leaves
  # a `skipped` check instead, which branch protection treats as passing.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      renovate_config: ${{ steps.filter.outputs.renovate_config }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: .github/filters.yml

  validate:
    name: Validate Renovate Config
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.renovate_config == 'true' ||
      needs.changes.outputs.ci == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      
      - name: Install Renovate
        run: npm install -g renovate
      
      - name: Validate Renovate Config
        run: renovate-config-validator
