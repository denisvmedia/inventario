name: Release

on:
  # Tag push -> real release: uploads binaries/archives to a GitHub Release.
  push:
    tags:
      - 'v*'
  # PR -> dry-run: validate goreleaser config + binaries can still be built
  # before they're irreversibly tagged. Runs for every PR (not only
  # master-targeted ones) so PR-train branches exercise the dry-run before they
  # eventually land on master; the `changes` job below narrows it to diffs that
  # can plausibly break the goreleaser pipeline.
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Resolve which ecosystems this PR touches. See .github/filters.yml +
  # devdocs/ci/conditional-execution.md. A workflow-level `paths:` filter
  # creates no check run at all on the pull requests it skips, which is what
  # keeps a context from being required (#1816, #2569); the gate below leaves
  # a `skipped` check instead, which branch protection treats as passing.
  #
  # Only the pull-request dry-run is gated. A tag push is a release and always
  # runs.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      image_inputs: ${{ steps.filter.outputs.image_inputs }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: .github/filters.yml

  goreleaser:
    # Docker images are built and pushed by docker.yml on the same tag push
    # (push: tags: ['v*']). This job only owns binaries, archives and the
    # GitHub Release, so QEMU/Buildx/ghcr login are not needed here.
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.image_inputs == 'true' ||
      needs.changes.outputs.ci == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - id: vars
        uses: ./.github/actions/vars

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: 1.27.4
          cache: true
          cache-dependency-path: go/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ steps.vars.outputs.node_version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Go dependencies
        run: go mod download
        working-directory: go

      - name: Check the chart pins this release
        # Chart.appVersion is the default for image.tag, so a tag whose chart
        # still names the previous release ships an install that silently
        # deploys the wrong image (#2035).
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          chart="$(grep -E '^appVersion:' helm/inventario/Chart.yaml | head -1 | tr -d '"' | awk '{print $2}')"
          want="${TAG}"
          if [ "$chart" != "$want" ]; then
            echo "::error::helm/inventario/Chart.yaml appVersion is '${chart}', expected '${want}' for tag ${TAG}. Bump it before tagging."
            exit 1
          fi
          echo "chart appVersion ${chart} matches ${TAG}"

      - name: Resolve the release notes
        id: notes
        # Three sources, in order (#2155):
        #   1. .github/release-notes/<tag>.md — a hand-written announcement,
        #      for a release that wants prose rather than a change list. Rare.
        #   2. The CHANGELOG.md section for the tag. This is the normal path:
        #      the entries were written as the changes landed, so nobody
        #      assembles a list at tag time.
        #   3. Neither — goreleaser generates a changelog from the commits.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          file=".github/release-notes/${TAG}.md"
          if [ -f "$file" ]; then
            echo "Using $file"
            echo "args=--release-notes=${file}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          generated="${RUNNER_TEMP}/release-notes-${TAG}.md"
          if ./.github/scripts/changelog-section.sh "$TAG" > "$generated"; then
            echo "Using the CHANGELOG.md section for ${TAG}"
            cat "$generated"
            echo "args=--release-notes=${generated}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::warning::no notes for ${TAG} in .github/release-notes/ or CHANGELOG.md; goreleaser will generate the changelog from commits"

      - name: Run GoReleaser
        # PR runs the snapshot dry-run (no GitHub Release upload, no signing,
        # no SBOM); tag push runs the real release.
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          # Pin goreleaser CLI to v2.x (avoids the action's `latest`
          # default-warning and shields PRs from a surprise major bump).
          version: '~> v2'
          args: ${{ github.event_name == 'pull_request' && 'release --snapshot --clean --skip=publish,sbom,sign' || format('release --clean {0}', steps.notes.outputs.args) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  helm-chart:
    # Publishes the chart to oci://ghcr.io/denisvmedia/charts/inventario, and
    # attaches the packaged chart to the GitHub Release goreleaser made. The
    # chart keeps its own SemVer (`version` in Chart.yaml); `appVersion` is the
    # release, which the goreleaser job already checked.
    #
    # A published version is never overwritten. If the version is already in
    # the registry and nothing under helm/inventario changed since the previous
    # tag, the chart is the same and this job skips. If the chart did change,
    # the job fails until Chart.yaml gets a new version.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      TAG: ${{ github.ref_name }}
      CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin

      - name: Decide whether to publish
        id: decide
        run: |
          set -euo pipefail
          version="$(grep -E '^version:' helm/inventario/Chart.yaml | head -1 | tr -d '"' | awk '{print $2}')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if ! helm show chart "$CHART_REPO/inventario" --version "$version" > /dev/null 2>&1; then
            echo "Chart $version is not published yet."
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          prev="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -n "$prev" ] && git diff --quiet "$prev" "$TAG" -- helm/inventario; then
            echo "Chart $version is already published, and helm/inventario is unchanged since $prev. Nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::helm/inventario changed since ${prev:-the first commit}, but chart version $version is already published. Bump version in helm/inventario/Chart.yaml."
          exit 1

      - name: Package and push the chart
        if: steps.decide.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          helm package helm/inventario --destination dist
          helm push "dist/inventario-${VERSION}.tgz" "$CHART_REPO"

      - name: Attach the chart to the GitHub Release
        if: steps.decide.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.decide.outputs.version }}
        run: gh release upload "$TAG" "dist/inventario-${VERSION}.tgz" --clobber
