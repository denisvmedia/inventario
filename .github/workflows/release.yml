name: Release

on:
  # Tag push -> real release: uploads binaries/archives to a GitHub Release.
  push:
    tags:
      - 'v*'
  # PR -> dry-run: validate goreleaser config + binaries can still be built
  # before they're irreversibly tagged. Path filter narrows triggers to
  # changes that can plausibly break the goreleaser pipeline. Runs for
  # every PR (not only master-targeted ones) so PR-train branches exercise
  # the dry-run before they eventually land on master.
  pull_request:
    paths:
      - '.goreleaser.yaml'
      - 'go/**'
      - 'frontend/**'
      - 'Makefile'
      - '.github/workflows/release.yml'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  goreleaser:
    # Docker images are built and pushed by docker.yml on the same tag push
    # (push: tags: ['v*']). This job only owns binaries, archives and the
    # GitHub Release, so QEMU/Buildx/ghcr login are not needed here.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - id: vars
        uses: ./.github/actions/vars

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.27.1
          cache: true
          cache-dependency-path: go/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ steps.vars.outputs.node_version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Go dependencies
        run: go mod download
        working-directory: go

      - name: Check the chart pins this release
        # Chart.appVersion is the default for image.tag, so a tag whose chart
        # still names the previous release ships an install that silently
        # deploys the wrong image (#2035).
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          chart="$(grep -E '^appVersion:' helm/inventario/Chart.yaml | head -1 | tr -d '"' | awk '{print $2}')"
          want="${TAG}"
          if [ "$chart" != "$want" ]; then
            echo "::error::helm/inventario/Chart.yaml appVersion is '${chart}', expected '${want}' for tag ${TAG}. Bump it before tagging."
            exit 1
          fi
          echo "chart appVersion ${chart} matches ${TAG}"

      - name: Resolve the release notes
        id: notes
        # Three sources, in order (#2155):
        #   1. .github/release-notes/<tag>.md — a hand-written announcement,
        #      for a release that wants prose rather than a change list. Rare.
        #   2. The CHANGELOG.md section for the tag. This is the normal path:
        #      the entries were written as the changes landed, so nobody
        #      assembles a list at tag time.
        #   3. Neither — goreleaser generates a changelog from the commits.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          file=".github/release-notes/${TAG}.md"
          if [ -f "$file" ]; then
            echo "Using $file"
            echo "args=--release-notes=${file}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          generated="${RUNNER_TEMP}/release-notes-${TAG}.md"
          if ./.github/scripts/changelog-section.sh "$TAG" > "$generated"; then
            echo "Using the CHANGELOG.md section for ${TAG}"
            cat "$generated"
            echo "args=--release-notes=${generated}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::warning::no notes for ${TAG} in .github/release-notes/ or CHANGELOG.md; goreleaser will generate the changelog from commits"

      - name: Run GoReleaser
        # PR runs the snapshot dry-run (no GitHub Release upload, no signing,
        # no SBOM); tag push runs the real release.
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          # Pin goreleaser CLI to v2.x (avoids the action's `latest`
          # default-warning and shields PRs from a surprise major bump).
          version: '~> v2'
          args: ${{ github.event_name == 'pull_request' && 'release --snapshot --clean --skip=publish,sbom,sign' || format('release --clean {0}', steps.notes.outputs.args) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
