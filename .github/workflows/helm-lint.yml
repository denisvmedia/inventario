name: Helm Lint

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Resolve which ecosystems this PR touches. See .github/filters.yml +
  # devdocs/ci/conditional-execution.md. A workflow-level `paths:` filter
  # creates no check run at all on the pull requests it skips, which is what
  # keeps a context from being required (#1816, #2569); the gate below leaves
  # a `skipped` check instead, which branch protection treats as passing.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      helm: ${{ steps.filter.outputs.helm }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: .github/filters.yml

  lint:
    name: Lint Helm chart
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.helm == 'true' ||
      needs.changes.outputs.ci == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Lint chart with production-style values
        run: >-
          helm lint helm/inventario
          --set-string secrets.dbDsn='postgres://user:pass@pg-host:5432/inventario?sslmode=require'
          --set-string secrets.jwtSecret='testtesttesttesttesttesttesttest'
          --set-string secrets.fileSigningKey='testtesttesttesttesttesttesttest'
          --set setupJob.initData.adminPassword=test

      - name: Render chart with production-style values
        run: >-
          helm template inventario helm/inventario
          --set-string secrets.dbDsn='postgres://user:pass@pg-host:5432/inventario?sslmode=require'
          --set-string secrets.jwtSecret='testtesttesttesttesttesttesttest'
          --set-string secrets.fileSigningKey='testtesttesttesttesttesttesttest'
          --set setupJob.initData.adminPassword=test
          > /tmp/inventario-production-render.yaml

      - name: Render chart with existing secret
        run: >-
          helm template inventario helm/inventario
          --set-string secrets.existingSecret=inventario-runtime
          > /tmp/inventario-existing-secret-render.yaml

      - name: Lint chart with demo services enabled
        run: >-
          helm lint helm/inventario
          --set demo.postgresql.enabled=true
          --set demo.redis.enabled=true
          --set demo.minio.enabled=true
          --set setupJob.initData.adminPassword=demo-secret

      - name: Render chart with demo services enabled
        run: >-
          helm template inventario helm/inventario
          --set demo.postgresql.enabled=true
          --set demo.redis.enabled=true
          --set demo.minio.enabled=true
          --set setupJob.initData.adminPassword=demo-secret
          > /tmp/inventario-demo-render.yaml

      - name: Render chart in split mode (apiserver + all worker groups)
        run: >-
          helm template inventario helm/inventario
          --set-string secrets.dbDsn='postgres://user:pass@pg-host:5432/inventario?sslmode=require'
          --set-string secrets.jwtSecret='testtesttesttesttesttesttesttest'
          --set-string secrets.fileSigningKey='testtesttesttesttesttesttesttest'
          --set setupJob.initData.adminPassword=test
          --set run.all.enabled=false
          --set run.apiserver.enabled=true
          --set run.workers.archive.enabled=true
          --set run.workers.emails.enabled=true
          --set run.workers.housekeeping.enabled=true
          --set run.workers.media.enabled=true
          > /tmp/inventario-split-all-render.yaml

      - name: Render chart in split mode (apiserver only)
        run: >-
          helm template inventario helm/inventario
          --set-string secrets.dbDsn='postgres://user:pass@pg-host:5432/inventario?sslmode=require'
          --set-string secrets.jwtSecret='testtesttesttesttesttesttesttest'
          --set-string secrets.fileSigningKey='testtesttesttesttesttesttesttest'
          --set setupJob.initData.adminPassword=test
          --set run.all.enabled=false
          --set run.apiserver.enabled=true
          > /tmp/inventario-split-apiserver-render.yaml

      - name: Render chart in split mode (worker-groups subset + HPA stubs)
        run: >-
          helm template inventario helm/inventario
          --set-string secrets.dbDsn='postgres://user:pass@pg-host:5432/inventario?sslmode=require'
          --set-string secrets.jwtSecret='testtesttesttesttesttesttesttest'
          --set-string secrets.fileSigningKey='testtesttesttesttesttesttesttest'
          --set setupJob.initData.adminPassword=test
          --set run.all.enabled=false
          --set run.apiserver.enabled=true
          --set run.apiserver.autoscaling.enabled=true
          --set run.workers.media.enabled=true
          --set run.workers.media.autoscaling.enabled=true
          --set run.workers.archive.enabled=true
          > /tmp/inventario-split-workers-subset-render.yaml

      - name: Verify missing DSN is rejected
        run: |
          set -euo pipefail

          if helm template inventario helm/inventario \
            > /tmp/inventario-missing-dsn-render.yaml \
            2> /tmp/inventario-missing-dsn-error.log; then
            echo "Expected helm template to fail when neither secrets.dbDsn nor secrets.existingSecret is set." >&2
            exit 1
          fi

          cat /tmp/inventario-missing-dsn-error.log
          grep -Eq 'dbDsn|existingSecret|DSN' /tmp/inventario-missing-dsn-error.log

      - name: Verify run.all + run.apiserver mutual exclusion is rejected
        run: |
          set -euo pipefail

          if helm template inventario helm/inventario \
            --set-string secrets.dbDsn='postgres://user:pass@pg-host:5432/inventario?sslmode=require' \
            --set-string secrets.jwtSecret='testtesttesttesttesttesttesttest' \
            --set-string secrets.fileSigningKey='testtesttesttesttesttesttesttest' \
            --set setupJob.initData.adminPassword=test \
            --set run.apiserver.enabled=true \
            > /tmp/inventario-mutex-render.yaml \
            2> /tmp/inventario-mutex-error.log; then
            echo "Expected helm template to fail when run.all and run.apiserver are both enabled." >&2
            exit 1
          fi

          cat /tmp/inventario-mutex-error.log
          grep -Eq 'mutually exclusive' /tmp/inventario-mutex-error.log

      - name: Verify no-topology configuration is rejected
        run: |
          set -euo pipefail

          if helm template inventario helm/inventario \
            --set-string secrets.dbDsn='postgres://user:pass@pg-host:5432/inventario?sslmode=require' \
            --set-string secrets.jwtSecret='testtesttesttesttesttesttesttest' \
            --set-string secrets.fileSigningKey='testtesttesttesttesttesttesttest' \
            --set setupJob.initData.adminPassword=test \
            --set run.all.enabled=false \
            > /tmp/inventario-no-topology-render.yaml \
            2> /tmp/inventario-no-topology-error.log; then
            echo "Expected helm template to fail when neither run.all nor a split role is enabled." >&2
            exit 1
          fi

          cat /tmp/inventario-no-topology-error.log
          grep -Eq 'No run topology' /tmp/inventario-no-topology-error.log

      - name: Verify workers-only configuration is rejected
        run: |
          set -euo pipefail

          if helm template inventario helm/inventario \
            --set-string secrets.dbDsn='postgres://user:pass@pg-host:5432/inventario?sslmode=require' \
            --set-string secrets.jwtSecret='testtesttesttesttesttesttesttest' \
            --set-string secrets.fileSigningKey='testtesttesttesttesttesttesttest' \
            --set setupJob.initData.adminPassword=test \
            --set run.all.enabled=false \
            --set run.workers.media.enabled=true \
            > /tmp/inventario-workers-only-render.yaml \
            2> /tmp/inventario-workers-only-error.log; then
            echo "Expected helm template to fail when any worker is enabled without run.apiserver." >&2
            exit 1
          fi

          cat /tmp/inventario-workers-only-error.log
          grep -Eq 'Workers-only mode is not supported' /tmp/inventario-workers-only-error.log

      - name: Render chart in split mode with a long release name (name-collision guard)
        run: |
          set -euo pipefail

          # 53-char release name (helm's max). Combined with the
          # 10-char `-inventario` chart-name suffix, the unpatched
          # `inventario.fullname | trunc 63` would consume every
          # available char, so the role suffixes (`-worker-<group>`
          # up to 20 chars, or `-apiserver` 10 chars) would be sliced
          # off by the trailing `trunc 63` and every resource would
          # collapse to the same name.
          # inventario.splitBaseName pre-truncates the base so the
          # suffix is never lost to the trailing trunc 63 — every
          # Deployment/Service/HPA name in this render must remain
          # unique.
          helm template inventario-long-release-name-collision-check-helmlint helm/inventario \
            --set-string secrets.dbDsn='postgres://user:pass@pg-host:5432/inventario?sslmode=require' \
            --set-string secrets.jwtSecret='testtesttesttesttesttesttesttest' \
            --set-string secrets.fileSigningKey='testtesttesttesttesttesttesttest' \
            --set setupJob.initData.adminPassword=test \
            --set run.all.enabled=false \
            --set run.apiserver.enabled=true \
            --set run.workers.archive.enabled=true \
            --set run.workers.emails.enabled=true \
            --set run.workers.housekeeping.enabled=true \
            --set run.workers.media.enabled=true \
            > /tmp/inventario-long-release-render.yaml

          # Extract every Deployment name in the render and require uniqueness.
          # Without the splitBaseName pre-truncation, the -apiserver and -worker-*
          # suffixes would collapse onto inventario.fullname and onto each other.
          dep_names="$(awk '
            /^kind: Deployment$/ { in_kind=1; next }
            in_kind && /^metadata:/ { in_meta=1; next }
            in_meta && /^  name: / { print $2; in_kind=0; in_meta=0; next }
            /^---/ { in_kind=0; in_meta=0 }
          ' /tmp/inventario-long-release-render.yaml)"

          echo "Rendered Deployment names:"
          echo "$dep_names"

          dup_count="$(echo "$dep_names" | sort | uniq -d | wc -l)"
          if [ "$dup_count" -ne 0 ]; then
            echo "Duplicate Deployment names detected in long-release split render — name truncation collapsed the role suffix." >&2
            echo "$dep_names" | sort | uniq -d >&2
            exit 1
          fi

          # apiserver + 4 workers = 5 split-mode Deployments expected.
          expected=5
          actual="$(echo "$dep_names" | grep -c .)"
          if [ "$actual" -ne "$expected" ]; then
            echo "Expected ${expected} unique split-mode Deployment names, got ${actual}." >&2
            exit 1
          fi

      - name: Verify empty-HPA-metrics configuration is rejected
        run: |
          set -euo pipefail

          # autoscaling.enabled=true with both target* nulled and metrics=[]
          # would render `spec.metrics:` with no items — invalid for
          # autoscaling/v2. inventario.hpaMetrics fails the render instead.
          if helm template inventario helm/inventario \
            --set-string secrets.dbDsn='postgres://user:pass@pg-host:5432/inventario?sslmode=require' \
            --set-string secrets.jwtSecret='testtesttesttesttesttesttesttest' \
            --set-string secrets.fileSigningKey='testtesttesttesttesttesttesttest' \
            --set setupJob.initData.adminPassword=test \
            --set run.all.autoscaling.enabled=true \
            --set run.all.autoscaling.targetCPUUtilizationPercentage=null \
            --set run.all.autoscaling.targetMemoryUtilizationPercentage=null \
            > /tmp/inventario-empty-hpa-render.yaml \
            2> /tmp/inventario-empty-hpa-error.log; then
            echo "Expected helm template to fail when autoscaling.enabled=true but no metrics are configured." >&2
            exit 1
          fi

          cat /tmp/inventario-empty-hpa-error.log
          grep -Eq 'no metrics are configured' /tmp/inventario-empty-hpa-error.log

      - name: Render chart with HPA metrics supplied only via the extensible list
        run: >-
          helm template inventario helm/inventario
          --set-string secrets.dbDsn='postgres://user:pass@pg-host:5432/inventario?sslmode=require'
          --set-string secrets.jwtSecret='testtesttesttesttesttesttesttest'
          --set-string secrets.fileSigningKey='testtesttesttesttesttesttesttest'
          --set setupJob.initData.adminPassword=test
          --set run.all.autoscaling.enabled=true
          --set run.all.autoscaling.targetCPUUtilizationPercentage=null
          --set run.all.autoscaling.metrics[0].type=External
          --set run.all.autoscaling.metrics[0].external.metric.name=inventario_jobs_pending
          --set run.all.autoscaling.metrics[0].external.target.type=AverageValue
          --set-string run.all.autoscaling.metrics[0].external.target.averageValue=5
          > /tmp/inventario-hpa-external-render.yaml

      - name: Install promtool
        # Pinned, and the same version the script's Docker fallback uses, so a
        # contributor without promtool on PATH runs the identical binary.
        env:
          PROMETHEUS_VERSION: 3.7.3
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/prometheus.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          tar -xzf /tmp/prometheus.tar.gz -C /tmp
          sudo install -m 0755 \
            "/tmp/prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool" /usr/local/bin/promtool
          promtool --version

      - name: Install amtool
        # Pinned to the version docker-compose runs, and the one the script's
        # Docker fallback uses.
        env:
          ALERTMANAGER_VERSION: 0.28.1
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/alertmanager.tar.gz \
            "https://github.com/prometheus/alertmanager/releases/download/v${ALERTMANAGER_VERSION}/alertmanager-${ALERTMANAGER_VERSION}.linux-amd64.tar.gz"
          tar -xzf /tmp/alertmanager.tar.gz -C /tmp
          sudo install -m 0755 \
            "/tmp/alertmanager-${ALERTMANAGER_VERSION}.linux-amd64/amtool" /usr/local/bin/amtool
          amtool --version

      - name: Unit-test the alert rules
        # The check below compares the alert SET between the chart and the dev
        # stack. This runs the expressions: a join written on the wrong label
        # produces an empty vector, at which point InventarioBackupStale can
        # never fire and InventarioBackupNeverRan fires forever (#2574).
        run: ./scripts/test-alert-rules.sh

      - name: Check the alert routing
        # And this runs the other half: an alert that fires and an alert that
        # reaches someone are different claims. Fails on an alert that is not
        # in the expected map, so adding one forces a decision about where it
        # pages (#2574).
        run: ./scripts/test-alert-routing.sh

      - name: Verify the monitoring resources render and the alert set matches
        run: |
          set -euo pipefail

          # The chart's PrometheusRule and the dev compose stack's rules file
          # hold the same alerts with different `up` selectors — the compose
          # stack has a static job name, a cluster does not (#2034). The
          # expressions may differ; the alert SET may not, or the dev stack
          # and production quietly stop testing the same thing.
          helm template inventario helm/inventario \
            --set-string secrets.dbDsn='postgres://user:pass@pg-host:5432/inventario?sslmode=require' \
            --set-string secrets.jwtSecret='testtesttesttesttesttesttesttest' \
            --set-string secrets.fileSigningKey='testtesttesttesttesttesttesttest' \
            --set setupJob.initData.adminPassword=test \
            --set run.all.enabled=false \
            --set run.apiserver.enabled=true \
            --set run.workers.media.enabled=true \
            --set metrics.serviceMonitor.enabled=true \
            --set metrics.podMonitor.enabled=true \
            --set metrics.prometheusRule.enabled=true \
            --set metrics.grafanaDashboard.enabled=true \
            --api-versions monitoring.coreos.com/v1 \
            > /tmp/inventario-monitoring-render.yaml

          for kind in ServiceMonitor PodMonitor PrometheusRule; do
            grep -q "^kind: $kind$" /tmp/inventario-monitoring-render.yaml || {
              echo "$kind did not render with its toggle on." >&2
              exit 1
            }
          done
          grep -q 'grafana_dashboard: "1"' /tmp/inventario-monitoring-render.yaml
          grep -q 'inventario-overview.json' /tmp/inventario-monitoring-render.yaml

          chart_alerts=$(grep -oE '\- alert: [A-Za-z0-9]+' /tmp/inventario-monitoring-render.yaml \
            | awk '{print $3}' | sort -u)
          compose_alerts=$(grep -oE '\- alert: [A-Za-z0-9]+' \
            deploy/monitoring/prometheus/rules/inventario.rules.yml | awk '{print $3}' | sort -u)
          if [ "$chart_alerts" != "$compose_alerts" ]; then
            echo "Chart and compose alert sets diverged." >&2
            diff <(echo "$chart_alerts") <(echo "$compose_alerts") >&2 || true
            exit 1
          fi
          echo "Alerts in both: $(echo "$chart_alerts" | tr '\n' ' ')"

          # Without the CRDs the toggles must be inert, not a render error.
          helm template inventario helm/inventario \
            --set-string secrets.dbDsn='postgres://user:pass@pg-host:5432/inventario?sslmode=require' \
            --set-string secrets.jwtSecret='testtesttesttesttesttesttesttest' \
            --set-string secrets.fileSigningKey='testtesttesttesttesttesttesttest' \
            --set setupJob.initData.adminPassword=test \
            --set metrics.serviceMonitor.enabled=true \
            --set metrics.podMonitor.enabled=true \
            --set metrics.prometheusRule.enabled=true \
            > /tmp/inventario-monitoring-nocrd.yaml
          if grep -qE '^kind: (ServiceMonitor|PodMonitor|PrometheusRule)$' /tmp/inventario-monitoring-nocrd.yaml; then
            echo "An operator CR rendered on a cluster without the CRDs." >&2
            exit 1
          fi

      - name: Verify every database waiter shares one retry budget
        run: |
          set -euo pipefail

          # The `migrate` init container and the init-data Job wait on the
          # same database. When their budgets diverged, a stall the init
          # container rode out failed the Job alone and took the whole
          # `helm install --wait-for-jobs` with it (#2243). Pin that they
          # render from dbRetry.* so they cannot drift apart again, and that
          # the migrate loop still stops on a dirty revision rather than
          # spending the budget on a decided outcome (#2416).
          # Both topologies render two waiters, from different templates:
          # argocdMode splits them across the Deployment's migrate init
          # container and the init-data Job; the default mode keeps both
          # inside the setup Job.
          for mode in true false; do
            helm template inventario helm/inventario \
              --set demo.postgresql.enabled=true \
              --set setupJob.argocdMode=$mode \
              --set setupJob.initData.adminPassword=demo-secret \
              --set dbRetry.attempts=42 \
              --set dbRetry.intervalSeconds=7 \
              > /tmp/inventario-dbretry-render.yaml

            waiters=$(grep -c 'attempts=42' /tmp/inventario-dbretry-render.yaml)
            if [ "$waiters" -ne 2 ]; then
              echo "argocdMode=$mode: expected 2 database waiters on the shared budget, found $waiters." >&2
              grep -n 'attempts=' /tmp/inventario-dbretry-render.yaml >&2
              exit 1
            fi
            grep -q 'interval=7' /tmp/inventario-dbretry-render.yaml
            grep -q 'recorded as dirty' /tmp/inventario-dbretry-render.yaml
            # No loop may keep the old hardcoded budget.
            if grep -q -- '-le 15' /tmp/inventario-dbretry-render.yaml; then
              echo "argocdMode=$mode: a retry loop still hardcodes 15 attempts." >&2
              grep -n -- '-le 15' /tmp/inventario-dbretry-render.yaml >&2
              exit 1
            fi
          done

      - name: Render chart with setupJob.argocdMode (combined + demo)
        run: |
          set -euo pipefail

          # argocdMode rearranges the setup work into three coordinated
          # resources (#1884 approach A): a bootstrap-only Job at sync-wave
          # -5, app Deployment(s) with a `migrate` init container at wave 0,
          # and a post-Deployment init-data Job at sync-wave +5. The render
          # checks below pin every required annotation, init-container name,
          # and Job-step move so a future refactor can't silently break the
          # ordering that the in-place ArgoCD upgrade story depends on.
          helm template inventario helm/inventario \
            --set demo.postgresql.enabled=true \
            --set demo.redis.enabled=true \
            --set demo.minio.enabled=true \
            --set setupJob.argocdMode=true \
            --set setupJob.initData.seedDatabase=true \
            --set setupJob.initData.adminPassword=demo-secret \
            > /tmp/inventario-argocd-combined-render.yaml

          # Setup Job:
          # - declares sync-wave "-5" (runs before the app Deployment)
          # - keeps the bootstrap init container
          # - drops the migrate + init-data steps (they live elsewhere now)
          setup_job_block="$(awk '
            /^# Source: inventario\/templates\/job-setup.yaml/ { in_block=1 }
            in_block { print }
            in_block && /^# Source: / && !/job-setup\.yaml/ { exit }
          ' /tmp/inventario-argocd-combined-render.yaml)"

          echo "$setup_job_block" | grep -Eq '"argocd.argoproj.io/sync-wave": "-5"' \
            || { echo "setup Job missing sync-wave -5" >&2; echo "$setup_job_block" >&2; exit 1; }
          echo "$setup_job_block" | grep -Eq '"argocd.argoproj.io/sync-options": "Force=true,Replace=true"' \
            || { echo "setup Job missing Force=true,Replace=true" >&2; exit 1; }
          # `--` separates options from the pattern so the leading `-`
          # in `- name: ...` isn't probed as a flag (matters for BSD grep
          # / ugrep; GNU grep on ubuntu-latest tolerates it but the
          # portability win is free).
          echo "$setup_job_block" | grep -Eq -- '- name: bootstrap' \
            || { echo "setup Job missing bootstrap init container" >&2; exit 1; }
          if echo "$setup_job_block" | grep -Eq -- '- name: migrate'; then
            echo "setup Job must not contain a migrate init container in argocdMode" >&2
            exit 1
          fi
          if echo "$setup_job_block" | grep -Eq -- '- name: init-data'; then
            echo "setup Job must not contain an init-data init container in argocdMode" >&2
            exit 1
          fi

          # App Deployment: must carry the `migrate` init container.
          deployment_block="$(awk '
            /^# Source: inventario\/templates\/deployment.yaml/ { in_block=1 }
            in_block { print }
            in_block && /^# Source: / && !/templates\/deployment\.yaml/ { exit }
          ' /tmp/inventario-argocd-combined-render.yaml)"

          echo "$deployment_block" | grep -Eq '^      initContainers:' \
            || { echo "combined Deployment missing initContainers block" >&2; exit 1; }
          echo "$deployment_block" | grep -Eq -- '- name: migrate' \
            || { echo "combined Deployment missing migrate init container" >&2; exit 1; }
          echo "$deployment_block" | grep -Eq 'inventario db migrate up' \
            || { echo "combined Deployment migrate container missing migrate-up command" >&2; exit 1; }

          # init-data Job: separate template, sync-wave +5, hosts init-data.
          init_data_block="$(awk '
            /^# Source: inventario\/templates\/job-init-data.yaml/ { in_block=1 }
            in_block { print }
            in_block && /^# Source: / && !/job-init-data\.yaml/ { exit }
          ' /tmp/inventario-argocd-combined-render.yaml)"

          test -n "$init_data_block" \
            || { echo "argocdMode render is missing the init-data Job" >&2; exit 1; }
          echo "$init_data_block" | grep -Eq '"argocd.argoproj.io/sync-wave": "5"' \
            || { echo "init-data Job missing sync-wave 5" >&2; exit 1; }
          echo "$init_data_block" | grep -Eq -- '- name: init-data' \
            || { echo "init-data Job missing init-data init container" >&2; exit 1; }

      - name: Render chart with setupJob.migrateInInitContainer (plain Helm)
        run: |
          set -euo pipefail

          # The in-pod migration ordering without ArgoCD (#2086). Same three
          # resources as argocdMode, held together by Helm hooks instead of
          # sync waves: a bootstrap-only setup Job on pre-install/pre-upgrade,
          # the `migrate` init container on the Deployment, and the init-data
          # Job on post-install/post-upgrade. Each assertion below is one of
          # the moves that makes the ordering work.
          helm template inventario helm/inventario \
            --set-string secrets.dbDsn='postgres://user:pass@pg-host:5432/inventario?sslmode=require' \
            --set-string secrets.jwtSecret='testtesttesttesttesttesttesttest' \
            --set-string secrets.fileSigningKey='testtesttesttesttesttesttesttest' \
            --set setupJob.initData.adminPassword=test \
            --set setupJob.migrateInInitContainer=true \
            > /tmp/inventario-migrate-in-pod-render.yaml

          setup_job_block="$(awk '
            /^# Source: inventario\/templates\/job-setup.yaml/ { in_block=1 }
            in_block { print }
            in_block && /^# Source: / && !/job-setup\.yaml/ { exit }
          ' /tmp/inventario-migrate-in-pod-render.yaml)"

          # Still a Helm hook — this is not ArgoCD — but bootstrap only.
          echo "$setup_job_block" | grep -Eq '"helm.sh/hook": "pre-install,pre-upgrade"' \
            || { echo "setup Job lost its Helm hook" >&2; echo "$setup_job_block" >&2; exit 1; }
          echo "$setup_job_block" | grep -Eq -- '- name: bootstrap' \
            || { echo "setup Job missing bootstrap init container" >&2; exit 1; }
          for step in migrate init-data; do
            if echo "$setup_job_block" | grep -Eq -- "- name: $step"; then
              echo "setup Job must not run $step when migrations moved to the pod" >&2
              exit 1
            fi
          done

          deployment_block="$(awk '
            /^# Source: inventario\/templates\/deployment.yaml/ { in_block=1 }
            in_block { print }
            in_block && /^# Source: / && !/templates\/deployment\.yaml/ { exit }
          ' /tmp/inventario-migrate-in-pod-render.yaml)"

          echo "$deployment_block" | grep -Eq -- '- name: migrate' \
            || { echo "Deployment missing migrate init container" >&2; exit 1; }
          echo "$deployment_block" | grep -Eq 'inventario db migrate up' \
            || { echo "migrate init container missing migrate-up command" >&2; exit 1; }

          init_data_block="$(awk '
            /^# Source: inventario\/templates\/job-init-data.yaml/ { in_block=1 }
            in_block { print }
            in_block && /^# Source: / && !/job-init-data\.yaml/ { exit }
          ' /tmp/inventario-migrate-in-pod-render.yaml)"

          test -n "$init_data_block" \
            || { echo "render is missing the init-data Job" >&2; exit 1; }
          # A POST-phase hook: it has to run after the Deployment exists, not
          # before it. A pre- hook here would migrate data against the old
          # schema, which is the whole failure this arrangement avoids.
          echo "$init_data_block" | grep -Eq '"helm.sh/hook": "post-install,post-upgrade"' \
            || { echo "init-data Job is not a post-phase Helm hook" >&2; echo "$init_data_block" >&2; exit 1; }
          if echo "$init_data_block" | grep -Eq 'argocd.argoproj.io'; then
            echo "init-data Job carries ArgoCD annotations outside argocdMode" >&2
            exit 1
          fi

      - name: Render chart with setupJob.argocdMode (split + external services)
        run: |
          set -euo pipefail

          # Split-mode parity: every Deployment (apiserver + each worker
          # group) must include the migrate init container in argocdMode,
          # since they all go through verifySchemaMatchesBinary at startup.
          helm template inventario helm/inventario \
            --set-string secrets.dbDsn='postgres://user:pass@pg-host:5432/inventario?sslmode=require' \
            --set-string secrets.jwtSecret='testtesttesttesttesttesttesttest' \
            --set-string secrets.fileSigningKey='testtesttesttesttesttesttesttest' \
            --set setupJob.argocdMode=true \
            --set setupJob.initData.adminPassword=test \
            --set run.all.enabled=false \
            --set run.apiserver.enabled=true \
            --set run.workers.archive.enabled=true \
            --set run.workers.emails.enabled=true \
            --set run.workers.housekeeping.enabled=true \
            --set run.workers.media.enabled=true \
            > /tmp/inventario-argocd-split-render.yaml

          # Every Deployment must contain a migrate init container.
          deployment_count="$(grep -c '^kind: Deployment$' /tmp/inventario-argocd-split-render.yaml)"
          migrate_count="$(grep -c '^        - name: migrate$' /tmp/inventario-argocd-split-render.yaml)"
          if [ "$deployment_count" -ne "$migrate_count" ]; then
            echo "Expected migrate init container in every Deployment: ${deployment_count} Deployments, ${migrate_count} migrate containers." >&2
            grep -nE '^kind: Deployment|^        - name: migrate' /tmp/inventario-argocd-split-render.yaml >&2 || true
            exit 1
          fi

      - name: Render chart with quota.enabled=false (default — no quota emitted)
        run: |
          set -euo pipefail

          # #1866: quota.yaml is opt-in. Default render must not emit
          # ResourceQuota or LimitRange (operators using `helm install`
          # against a production namespace don't expect chart-managed
          # quotas to land silently).
          helm template inventario helm/inventario \
            --set-string secrets.dbDsn='postgres://user:pass@pg-host:5432/inventario?sslmode=require' \
            --set-string secrets.jwtSecret='testtesttesttesttesttesttesttest' \
            --set-string secrets.fileSigningKey='testtesttesttesttesttesttesttest' \
            --set setupJob.initData.adminPassword=test \
            > /tmp/inventario-quota-off-render.yaml

          if grep -Eq '^kind: (ResourceQuota|LimitRange)$' /tmp/inventario-quota-off-render.yaml; then
            echo "Default render must not include ResourceQuota or LimitRange (quota.enabled=false)." >&2
            exit 1
          fi
          if grep -Eq '^# Source: inventario/templates/quota\.yaml' /tmp/inventario-quota-off-render.yaml; then
            echo "Default render must not include templates/quota.yaml output." >&2
            exit 1
          fi

      - name: Render chart with quota.enabled=true (ResourceQuota + LimitRange)
        run: |
          set -euo pipefail

          # #1866: opt-in render emits both a ResourceQuota carrying the
          # full hard-cap surface and a LimitRange with container defaults
          # so ad-hoc pods inherit limits and don't get rejected by the
          # ResourceQuota's `limits.*` admission check.
          helm template inventario helm/inventario \
            --set-string secrets.dbDsn='postgres://user:pass@pg-host:5432/inventario?sslmode=require' \
            --set-string secrets.jwtSecret='testtesttesttesttesttesttesttest' \
            --set-string secrets.fileSigningKey='testtesttesttesttesttesttesttest' \
            --set setupJob.initData.adminPassword=test \
            --set quota.enabled=true \
            > /tmp/inventario-quota-on-render.yaml

          quota_block="$(awk '
            /^# Source: inventario\/templates\/quota.yaml/ { in_block=1 }
            in_block { print }
            in_block && /^# Source: / && !/quota\.yaml/ { exit }
          ' /tmp/inventario-quota-on-render.yaml)"

          test -n "$quota_block" \
            || { echo "quota.enabled=true render is missing templates/quota.yaml output" >&2; exit 1; }

          echo "$quota_block" | grep -Eq '^kind: ResourceQuota$' \
            || { echo "quota render missing ResourceQuota" >&2; echo "$quota_block" >&2; exit 1; }
          echo "$quota_block" | grep -Eq '^kind: LimitRange$' \
            || { echo "quota render missing LimitRange" >&2; echo "$quota_block" >&2; exit 1; }

          # Sync-wave -10 (before bootstrap Job at -5) so the quota is in
          # effect before any chart-rendered pod schedules.
          wave_count="$(echo "$quota_block" | grep -c '"argocd.argoproj.io/sync-wave": "-10"')"
          [ "$wave_count" -eq 2 ] \
            || { echo "Expected sync-wave -10 on both quota resources, got ${wave_count}" >&2; exit 1; }

          # Every default hard-cap key from values.yaml must round-trip.
          for key in requests.cpu requests.memory limits.cpu limits.memory requests.storage persistentvolumeclaims pods; do
            echo "$quota_block" | grep -Eq "^[[:space:]]+${key}: " \
              || { echo "quota.hard.${key} missing from ResourceQuota render" >&2; echo "$quota_block" >&2; exit 1; }
          done

          # LimitRange must declare per-Container defaults so unconfigured
          # ad-hoc pods inherit cpu/memory and aren't rejected by quota.
          echo "$quota_block" | grep -Eq '^[[:space:]]+- type: Container$' \
            || { echo "LimitRange missing Container type" >&2; exit 1; }
          echo "$quota_block" | grep -Eq '^[[:space:]]+defaultRequest:$' \
            || { echo "LimitRange missing defaultRequest" >&2; exit 1; }
          echo "$quota_block" | grep -Eq '^[[:space:]]+default:$' \
            || { echo "LimitRange missing default" >&2; exit 1; }
          echo "$quota_block" | grep -Eq '^[[:space:]]+max:$' \
            || { echo "LimitRange missing max" >&2; exit 1; }

      - name: Render chart with quota.enabled=true but limitRange.enabled=false
        run: |
          set -euo pipefail

          # Operators with a cluster-level LimitRange already in place can
          # turn off the chart's LimitRange while keeping the ResourceQuota.
          helm template inventario helm/inventario \
            --set-string secrets.dbDsn='postgres://user:pass@pg-host:5432/inventario?sslmode=require' \
            --set-string secrets.jwtSecret='testtesttesttesttesttesttesttest' \
            --set-string secrets.fileSigningKey='testtesttesttesttesttesttesttest' \
            --set setupJob.initData.adminPassword=test \
            --set quota.enabled=true \
            --set quota.limitRange.enabled=false \
            > /tmp/inventario-quota-no-limitrange-render.yaml

          grep -Eq '^kind: ResourceQuota$' /tmp/inventario-quota-no-limitrange-render.yaml \
            || { echo "ResourceQuota must still render when limitRange.enabled=false" >&2; exit 1; }
          if grep -Eq '^kind: LimitRange$' /tmp/inventario-quota-no-limitrange-render.yaml; then
            echo "LimitRange must NOT render when quota.limitRange.enabled=false" >&2
            exit 1
          fi

      - name: Render chart with setupJob.argocdMode=false (regression check)
        run: |
          set -euo pipefail

          # Non-argocdMode must keep the legacy behavior: single setup Job
          # with bootstrap + migrate + init-data, no migrate init container
          # on the Deployment, no separate init-data Job.
          helm template inventario helm/inventario \
            --set demo.postgresql.enabled=true \
            --set demo.redis.enabled=true \
            --set demo.minio.enabled=true \
            --set setupJob.initData.adminPassword=demo-secret \
            > /tmp/inventario-non-argocd-render.yaml

          if grep -q 'templates/job-init-data.yaml' /tmp/inventario-non-argocd-render.yaml; then
            echo "Non-argocdMode must not render the init-data Job." >&2
            exit 1
          fi

          # The combined Deployment must NOT have a migrate init container
          # outside argocdMode (it would re-run migrate on every pod restart
          # for `helm install` consumers that already get it via the Helm
          # hook).
          deployment_block="$(awk '
            /^# Source: inventario\/templates\/deployment.yaml/ { in_block=1 }
            in_block { print }
            in_block && /^# Source: / && !/templates\/deployment\.yaml/ { exit }
          ' /tmp/inventario-non-argocd-render.yaml)"

          if echo "$deployment_block" | grep -Eq -- '- name: migrate'; then
            echo "Non-argocdMode Deployment must not carry a migrate init container." >&2
            exit 1
          fi

          # The setup Job in non-argocdMode keeps the legacy three-step shape.
          setup_job_block="$(awk '
            /^# Source: inventario\/templates\/job-setup.yaml/ { in_block=1 }
            in_block { print }
            in_block && /^# Source: / && !/job-setup\.yaml/ { exit }
          ' /tmp/inventario-non-argocd-render.yaml)"

          for step in bootstrap migrate init-data; do
            echo "$setup_job_block" | grep -Eq -- "- name: ${step}" \
              || { echo "Non-argocdMode setup Job missing ${step} init container" >&2; exit 1; }
          done
