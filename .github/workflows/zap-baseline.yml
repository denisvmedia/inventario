name: ZAP Baseline Scan

# Passive security scan of the public surface (#848).
#
# Weekly and on demand, not on pull requests. The scan spiders the app and
# reports what an unauthenticated visitor can observe — headers, cookie flags,
# information disclosure. It needs a running stack, which takes minutes to
# build, and its findings change when ZAP's rules change rather than when this
# repository does. Neither belongs in a PR gate.
#
# It fails the job on any alert. A red scheduled run is a to-do list, not a
# blocked merge, and the alternative — a scan that always passes because its
# findings are advisory — is how a scanner stops being read. Each alert gets
# either a fix or a line in .zap/rules.tsv with the reason.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: ZAP baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      JWT_SECRET: "zap-scan-jwt-secret-exactly-32-chars!!"
      FILE_SIGNING_KEY: "zap-scan-file-signing-key-32chars!!"
      ADMIN_EMAIL: "admin@zapscan.example"
      ADMIN_PASSWORD: "ZapScanPass1!"
      SEED_DATABASE: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare host directories
        run: mkdir -p .docker/init-state && chmod 777 .docker/init-state

      - name: Build and start full stack
        run: docker compose up --build --wait --wait-timeout 420

      - name: Baseline scan
        # The action runs ZAP with --network=host, so localhost is the runner's.
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:3333
          rules_file_name: .zap/rules.tsv
          fail_action: true
          # The report is the artifact and the job status. Opening issues from
          # a workflow is off until someone asks for it.
          allow_issue_writing: false
          artifact_name: zap-baseline-report

      - name: Print service logs on failure
        if: failure()
        run: docker compose logs
