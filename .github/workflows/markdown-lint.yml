name: Markdown Lint

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      markdown: ${{ steps.filter.outputs.markdown }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Find the commit the pull request merges into
        id: base
        uses: ./.github/actions/pr-merge-base
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: .github/filters.yml
          # Diff with git: the pull request files API would spend the
          # repository's hourly request budget (devdocs/ci/github-api-budget.md).
          token: ''
          base: ${{ steps.base.outputs.sha }}

  markdownlint:
    name: markdownlint-cli2
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.markdown == 'true' ||
      needs.changes.outputs.ci == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Major-version pin keeps CI deterministic while letting dependabot
      # cleanly bump the action alongside other workflow upgrades.
      # v23.x ships markdownlint-cli2 v0.22.x (markdownlint v0.40.x), the
      # same versions developers get from `brew install markdownlint-cli2`.
      #
      # `globs: ''` explicitly overrides the action's default
      # `*.{md,markdown}` (which would only walk the repo root), forcing the
      # CLI to fall back to the `globs:` field in `.markdownlint-cli2.jsonc`.
      # The rule set is auto-loaded from `.markdownlint.jsonc`. Both files
      # live at the repo root and are the single source of truth — running
      # `markdownlint-cli2` locally with no arguments produces the same
      # result as this CI job.
      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@3ce8f712b5d8f31acd8e201be6d97e3d2bb23eb7 # v25
        with:
          globs: ''

      # markdownlint skips the fragments in changelog.d/ (see
      # .markdownlint-cli2.jsonc); this checks what the release assembly
      # needs from them and from CHANGELOG.md, an empty `## [Unreleased]`
      # included. It runs after a markdownlint failure too, so one push shows
      # both.
      - name: Check the changelog fragments
        if: ${{ !cancelled() }}
        run: ./scripts/changelog-assemble.sh --check
