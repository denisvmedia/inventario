name: CLI Integration Test

on:
  push:
    branches: [ main, master ]
  # Run for every PR — PR-train branches (base != master) still want the
  # same coverage the final master-targeted PR would get.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Resolve which ecosystems this PR touches. See .github/filters.yml +
  # devdocs/ci/conditional-execution.md. A workflow-level `paths:` filter
  # creates no check run at all on the pull requests it skips, which is what
  # keeps a context from being required (#1816, #2569); the gate below leaves
  # a `skipped` check instead, which branch protection treats as passing.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: .github/filters.yml

  cli-integration-test:
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.go == 'true' ||
      needs.changes.outputs.ci == 'true'
    
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: inventario_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: 1.27.1
        cache: true
        cache-dependency-path: go/go.sum

    - name: Install dependencies
      working-directory: ./go
      run: go mod download

    - name: Wait for PostgreSQL
      run: |
        until pg_isready -h localhost -p 5432 -U postgres; do
          echo "Waiting for PostgreSQL..."
          sleep 2
        done

    - name: Run CLI Integration Test
      working-directory: ./go
      env:
        POSTGRES_TEST_DSN: "postgres://postgres:postgres@localhost:5432/inventario_test?sslmode=disable"
      run: |
        echo "🚀 Starting CLI Workflow Integration Test"
        echo "=========================================="
        echo "📊 Database: $POSTGRES_TEST_DSN"
        echo ""
        echo "🧪 Running CLI workflow integration test..."
        go test ./integration -run TestCLIWorkflowIntegration -v -timeout=10m
        echo ""
        echo "✅ CLI workflow integration test completed successfully!"
        echo "🎉 The complete workflow from CLI setup to API access is working correctly."

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: cli-integration-test-results
        path: |
          go/integration/
        retention-days: 7
